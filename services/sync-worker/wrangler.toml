name = "vantara-sync"
main = "src/secure-index.ts"
compatibility_date = "2025-01-01"

# لا observability مدفوعة ولا cron: الخطة المجانية تكفي ثلاثة مستخدمين
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "vantara"
# يُستبدل عند النشر بمعرّف القاعدة الفعلي (انظر .github/workflows/sync-worker.yml).
# تثبيته في المستودع يعني أن أي fork ينشر على قاعدة غيره.
database_id = "__D1_DATABASE_ID__"

[observability]
enabled = true

# الأسماء ليست أسرارًا؛ القيم وحدها سرية في Cloudflare. إعلان الأسماء يجعل
# wrangler deploy يرفض النشر قبل تبديل النسخة إذا كان أي binding مفقودًا.
[secrets]
required = [
  "VANTARA_SESSION_SECRET",
  "VANTARA_IDENTITY_SECRET",
  "VANTARA_DEVICE_PEPPER",
]

[vars]
ALLOWED_ORIGINS = "https://vantara.pages.dev"
