[project]
name = "vantara-translation-worker"
version = "0.1.0"
requires-python = ">=3.11"
description = "الترجمة العربية: الكشف والـOCR من محرك جاهز، والرسم العربي من طبقتنا"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# H/W للأبعاد اصطلاح الرؤية الحاسوبية؛ وحقول الطلب mixedCase لأنها عقد JSON مع الـAPI
# RUF001-003: التعليقات والنصوص عربية بقصد (× و– والحروف العربية ليست التباسًا)
ignore = ["N806", "N815", "E741", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true
