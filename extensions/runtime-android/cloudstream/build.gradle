apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
android {
    namespace 'dev.vantara.runtime.cloudstream'
    compileSdk 35
    defaultConfig { minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget='17' }
    sourceSets.test.resources.srcDir('../../../docs/repository-compat')
}
dependencies {
    api project(':api')
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    api 'com.fasterxml.jackson.module:jackson-module-kotlin:2.18.4'
    api 'org.jsoup:jsoup:1.22.2'
    api 'com.squareup.okhttp3:okhttp:5.3.2'
    // Pinned WitAnime loads Fragment-typed background helpers even without a foreground Activity.
    implementation 'androidx.fragment:fragment:1.6.2'
    testImplementation 'junit:junit:4.13.2'
}
