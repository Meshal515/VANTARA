apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
// الإضافات تُصرَّف بـkotlinx.serialization، ومولّداتها تحتاج وقت التشغيل
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

// إصدار OkHttp في مكان واحد: التوحيد أدناه يقرأ منه، فلا يفترقان بالسهو.
def okhttpVersion = '5.3.2'

// ───────────────────────────── التوقيع والإصدار ─────────────────────────────
//
// كلها من متغيرات البيئة: لا مسار keystore ولا كلمة مرور ولا رقم إصدار في
// المستودع. البناء بلا هذه المتغيرات ينجح وينتج APK غير موقّع للتجربة
// المحلية، ولا يفشل — لكن `assembleRelease` في CI يفشل صراحةً إن غابت
// (انظر التحقق في .github/workflows/android-release.yml).
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAliasName = System.getenv('ANDROID_KEY_ALIAS') ?: 'vantara'
// كلمة مفتاح منفصلة اختيارية: الشائع أن تكون نفس كلمة المخزن
def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD') ?: keystorePassword

// متغيّران محليان لا تعبيران داخل `versionCode`/`versionName`.
//
// السبب نحوي: Groovy يفسّر `versionCode (x) as Integer` كـ
// `versionCode(x) as Integer` — فيُمرّر النص كما هو ويُحوّل *ناتج* النداء،
// فيتلقّى AGP سلسلة بدل رقم ويفشل التقييم بـ«Value is null».
def appVersionCode = (System.getenv('VANTARA_VERSION_CODE') ?: '1').toInteger()
def appVersionName = System.getenv('VANTARA_VERSION_NAME') ?: '1.0.0'
// بصمة الكود الأصلي (tools/native-fingerprint.mjs). حزمة واجهة تُعرض فقط فوق
// الـAPK الذي يحمل بصمتها نفسها. «dev» للبناء المحلي: لا تحديثات تلقائية.
def nativeFingerprint = System.getenv('VANTARA_NATIVE') ?: 'dev'

android {
    namespace "com.vantara.app"
    compileSdk rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    defaultConfig {
        applicationId "com.vantara.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // يرتفع مع كل إصدار: أندرويد يرفض تثبيت تحديث برقم أقل أو مساوٍ،
        // وفحص التحديث داخل التطبيق يقارن versionName
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "VANTARA_NATIVE", "\"${nativeFingerprint}\""
        // أجهزة المالكين كلها arm64؛ حصر المكتبات الأصلية (ONNX Runtime، QuickJS)
        // فيه يُبقي الـAPK بحجمه تقريبًا بدل أن يحمل أربع نسخ من كل مكتبة
        ndk { abiFilters 'arm64-v8a' }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // بلا keystore يبقى الخرج غير موقّع بدل أن يفشل البناء محليًا
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    // اسم ثابت للخرج: الرابط الذي يُرسل للأصدقاء لا يتغير مع كل إصدار
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                outputFileName = 'VANTARA-release.apk'
            }
        }
    }

    // محرّك الإضافات مكتوب بـKotlin ويسكن في `src/main/kotlin`، وإضافة
    // kotlin-android تضمّ هذا المجلد افتراضيًّا فلا يحتاج تصريحًا.
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { buildConfig true }

    packaging {
        // اعتماديات المحرك تشحن كلٌّ نسختها من ملفات META-INF نفسها، ودامج
        // الموارد يرفض التكرار:
        //   DuplicateRelativeFileException: 3 files found with path
        //   'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        // وهي بيانات OSGi وتراخيص لا يقرؤها التطبيق ولا الإضافة في زمن
        // التشغيل. ولا أستعمل `pickFirst`: «خذ أولها» يُخفي تعارضًا حقيقيًّا
        // لو وقع يومًا في ملفٍ يهمّ، بينما `excludes` يقول صراحة ما أُسقط.
        resources.excludes += [
            'META-INF/*.kotlin_module',
            'META-INF/versions/**/OSGI-INF/**',
            'META-INF/OSGI-INF/**',
            'META-INF/DEPENDENCIES',
            'META-INF/LICENSE*',
            'META-INF/NOTICE*',
            'META-INF/INDEX.LIST',
            'META-INF/*.SF',
            'META-INF/*.DSA',
            'META-INF/*.RSA',
        ]
    }
}

// ─────────────────────────────────────────────────────────────────────
// توحيد OkHttp بالقوة.
//
// الإضافات مبنيّة على OkHttp، وبعض الاعتماديات تسحب وحدات مختلفة منه. فإن
// بقيت واحدة على 4.x وأخرى على 5.x انكسر الرابط: `okhttp3.JavaNetCookieJar`
// في 4.x يشير إلى `okhttp3.internal.Util` وقد حُذف في 5.x، فينهار التطبيق
// بـNoClassDefFoundError في أول طلب.
// ─────────────────────────────────────────────────────────────────────
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.squareup.okhttp3') {
            details.useVersion okhttpVersion
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // ── محرّك الإضافات: سطح المستضيف الذي تشير إليه إضافات Keiyoushi ──
    // الإصدارات مثبَّتة بقصد وهي نفسها التي أثبتها spike على الجهاز.
    implementation "androidx.core:core-ktx:1.15.0"
    // `ConfigurableSource.setupPreferenceScreen` يأخذ PreferenceScreen في
    // توقيعه، فغيابه NoClassDefFoundError عند تحميل الصنف لا عند استعماله
    implementation "androidx.preference:preference-ktx:1.2.1"
    // اعتراض Cloudflare المشترك مع الـspike يطابق بصمة Chrome (UserAgentMetadata)
    // عبر WebSettingsCompat؛ نفس الإصدار الذي مرّت به المصادر الست عشرة
    implementation "androidx.webkit:webkit:1.17.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // ── الترجمة على الجوال: ONNX Runtime يشغّل نماذج الرؤية وOCR داخل الجهاز ──
    // الأوزان (~430MB) ليست هنا: تُنزَّل عند الطلب (ModelStore). المكتبة نفسها
    // ~12MB لـarm64 فقط (انظر abiFilters أدناه).
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.20.0"

    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    // `okhttp3.JavaNetCookieJar` يسكن هذه القطعة لا في okhttp نفسه
    implementation "com.squareup.okhttp3:okhttp-urlconnection:$okhttpVersion"
    implementation "com.squareup.okhttp3:okhttp-brotli:$okhttpVersion"
    // Azora أثبتت أن zstd مطلوب وقت التشغيل: NoClassDefFoundError okhttp3/zstd/Zstd
    implementation "com.squareup.okhttp3:okhttp-zstd:$okhttpVersion"
    implementation "com.squareup.okio:okio:3.16.4"

    // Jsoup: خط 1.x الذي تُصرَّف عليه keiyoushi
    implementation "org.jsoup:jsoup:1.22.2"
    // RxJava **1.x**: عقد lib 1.4 يرجع `rx.Observable`، لا Rx2 ولا Rx3
    implementation "io.reactivex:rxjava:1.3.8"

    // `-json-okio` ليس زائدًا: الإضافات تقرأ أجسام JSON عبر okio، وبلا هذه
    // القطعة يسقط المصدر عند أول استجابة JSON
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.8.1"

    // injekt: الإضافات تحصل على NetworkHelper و Json بـ`injectLazy()`
    implementation "com.github.null2264.injekt:injekt-core:4135455a2a"
    // بعض المصادر تُقيّم JavaScript لفكّ روابط الصفحات
    implementation "com.github.zhanghai.quickjs-java:quickjs-android:547f5b1597"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
