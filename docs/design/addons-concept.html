<title>تصور إضافات فانتارا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* التصور: خزانة هادئة. المثبت أولًا وترتيبه أولوية، والمزوّدات محور، وكل قرار يحتاجك في مكان واحد. ألوان فانتارا نفسها (core.css). */
:root{
  --bg:#08070c;--bg-raised:#0c0b12;--s1:#121019;--s2:#18161f;--s3:#211e2b;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --t1:#f3f4f8;--t2:#c9c5d4;--t3:#958fa8;--t4:#5f5a73;
  --accent:#8f5cff;--accent-press:#7a47f0;--accent-text:#bba2ff;--accent-soft:rgba(143,92,255,.14);--accent-line:rgba(143,92,255,.42);
  --ok:#5fd49a;--ok-soft:rgba(95,212,154,.12);--warn:#f2b75b;--warn-soft:rgba(242,183,91,.12);--bad:#ff6b7d;--bad-soft:rgba(255,107,125,.12);
  --chrome:#0e0d14;--chrome-fg:#c9c5d4;
  --f-ui:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif;--f-lat:"Inter","IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--t1);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:8px}
.lat{font-family:var(--f-lat);direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}

/* ── شريط التحكم بالتصور (خارج التطبيق) ── */
.stage{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;gap:14px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ctl h1{margin:0;font-size:17px;font-weight:700;color:var(--chrome-fg)}
.ctl h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--t3);margin-top:2px}
.seg{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:9px;font-size:13.5px;color:var(--t2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--t1)}
.screens{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.screens button{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;color:var(--t2)}
.screens button[aria-pressed="true"]{border-color:var(--accent-line);background:var(--accent-soft);color:var(--t1)}
.note{font-size:13px;color:var(--t3);line-height:1.7;max-width:110ch;margin:0}
.viewport{position:relative;width:100%;display:flex;justify-content:center}
.device{position:relative;flex:none;transform-origin:top center;border-radius:28px;overflow:hidden;border:1px solid var(--line-2);box-shadow:0 30px 80px rgba(0,0,0,.55);background:var(--bg)}
.device.desk{border-radius:12px}

/* ── التطبيق ── */
.app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);container-type:inline-size;container-name:app;scrollbar-width:thin}
.statusbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font:600 13px var(--f-lat);color:var(--t2)}
.desk .statusbar{display:none}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.back{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--t1)}
.back svg{width:22px;height:22px}
.topbar .title{font-size:22px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title small{display:block;font-size:13px;font-weight:500;color:var(--t3);margin-top:1px}
.btn{height:44px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;white-space:nowrap}
.btn svg{width:19px;height:19px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-press)}
.btn.ghost{background:var(--s2);border:1px solid var(--line-2);color:var(--t1)}
.btn.quiet{color:var(--accent-text);padding:0 10px}
.btn.sm{height:38px;padding:0 13px;font-size:14.5px;border-radius:11px}
.pad{padding:0 18px}

.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:15px;background:var(--s1);border:1px solid var(--line-2);color:var(--t3)}
.search svg{width:20px;height:20px;flex:none}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:16px;color:var(--t1)}
.search input::placeholder{color:var(--t3)}

.tabs{display:flex;gap:6px;padding:14px 18px 6px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;height:42px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;color:var(--t2);border:1px solid var(--line-2)}
.tab[aria-selected="true"]{background:var(--t1);color:#0b0a10;border-color:var(--t1)}
.tab .badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;font:700 12.5px var(--f-lat);background:var(--s3);color:var(--t1)}
.tab[aria-selected="true"] .badge{background:#0b0a10;color:#fff}
.tab .badge.alert{background:var(--bad);color:#fff}

/* بطاقة «تحتاجك» المختصرة أعلى المثبتة */
.needs{width:calc(100% - 36px);margin:12px 18px 4px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(0deg,var(--s1),var(--s1));border:1px solid var(--line-2)}
.needs .dot{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.needs .dot svg{width:22px;height:22px}
.needs b{display:block;font-size:16px}
.needs span{display:block;font-size:14px;color:var(--t2);margin-top:2px}
.needs .grow{flex:1;min-width:0}

/* الأقسام */
.secs{display:grid;gap:22px;padding:14px 18px 120px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{margin:0;font-size:19px;font-weight:700;display:flex;align-items:center;gap:9px}
.sec-h h2 .c{font:600 14px var(--f-lat);color:var(--t3)}
.sec-h p{margin:3px 0 0;font-size:13.5px;color:var(--t3)}
.list{border-radius:18px;background:var(--s1);border:1px solid var(--line);overflow:hidden}

/* الصف: الرتبة، الشعار، الاسم والمصدر، الحالة، مقبض السحب */
.row{position:relative;display:flex;align-items:center;gap:13px;min-height:78px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--s1);touch-action:pan-y;user-select:none}
.row:last-child{border-bottom:0}
.row:active{background:var(--s2)}
.row.drag{z-index:3;background:var(--s3);box-shadow:0 14px 34px rgba(0,0,0,.5);border-radius:14px}
.rank{width:26px;flex:none;text-align:center;font:700 15px var(--f-lat);color:var(--t3)}
.rank.top{color:var(--accent-text)}
.logo{width:52px;height:52px;flex:none;border-radius:15px;display:grid;place-items:center;overflow:hidden;font:800 21px var(--f-lat);border:1px solid var(--line-2)}
.logo.lg{width:84px;height:84px;border-radius:24px;font-size:34px}
.logo.xl{width:96px;height:96px;border-radius:26px;font-size:40px}
.info{flex:1;min-width:0}
.name{font-size:17px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:14px;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .sep{color:var(--t4);margin:0 5px}
.state{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;margin-top:5px}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.state.ok{color:var(--ok)}.state.warn{color:var(--warn)}.state.bad{color:var(--bad)}
.handle{width:44px;height:48px;flex:none;display:grid;place-items:center;color:var(--t3);cursor:grab;touch-action:none}
.handle svg{width:22px;height:22px}
.off .name,.off .logo{opacity:.45}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:700;letter-spacing:.2px}
.tag.repo{background:rgba(120,170,255,.13);color:#a9c6ff}
.tag.mani{background:rgba(95,212,154,.13);color:#8fe3b8}
.tag.site{background:rgba(255,189,85,.13);color:#ffd08a}

/* المزوّدات */
.hub-sum{margin:6px 18px 0;padding:18px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;gap:16px}
.hub-sum b{font:800 34px var(--f-lat)}
.hub-sum span{font-size:15px;color:var(--t2);line-height:1.5}
.grp-t{font-size:13.5px;font-weight:700;color:var(--t3);letter-spacing:.4px;margin:20px 18px 10px}
.prov{display:grid;gap:10px;padding:0 18px}
.pcard{display:flex;align-items:center;gap:15px;padding:16px;border-radius:20px;background:var(--s1);border:1px solid var(--line);text-align:start;width:100%}
.pcard:active{background:var(--s2)}
.pcard .pi{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.pcard .pi svg{width:27px;height:27px}
.pcard h3{margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard p{margin:3px 0 0;font-size:14.5px;color:var(--t2)}
.pcard .nums{display:flex;gap:14px;margin-top:8px;font-size:13.5px;color:var(--t3);flex-wrap:wrap}
.pcard .nums b{color:var(--t1);font:700 14.5px var(--f-lat);margin-inline-end:4px}
.chev{width:22px;height:22px;color:var(--t3);flex:none}

/* الشرائح */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line-2);font-size:14.5px;color:var(--t2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--t1)}

/* زر التثبيت ومراحله */
.inst{min-width:96px;height:42px;padding:0 14px;border-radius:12px;font-size:15px;font-weight:700;display:inline-grid;place-items:center;position:relative;overflow:hidden;flex:none}
.inst.get{background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--accent-line)}
.inst.have{color:var(--t3);border:1px solid var(--line-2)}
.inst.up{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(242,183,91,.35)}
.inst.busy{background:var(--s3);color:var(--t1)}
.inst.busy i{position:absolute;inset:auto 0 0 0;height:3px;background:var(--accent);transform-origin:right;animation:fill 1.4s ease-out forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* رأس المستودع والمنفيست */
.hero{margin:6px 18px 0;padding:20px;border-radius:22px;background:var(--s1);border:1px solid var(--line);display:grid;gap:14px}
.hero .top{display:flex;gap:16px;align-items:center}
.hero h2{margin:0;font-size:24px;font-weight:700}
.hero .sub{font-size:14.5px;color:var(--t2);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .url{font:500 13.5px var(--f-lat);color:var(--t3);direction:ltr;text-align:right;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px;border-radius:14px;background:var(--s2)}
.stat b{display:block;font:800 22px var(--f-lat)}
.stat span{font-size:13.5px;color:var(--t2)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.explain{font-size:14px;color:var(--t2);line-height:1.7;margin:0}

/* ورقة التفاصيل */
.sheet{position:absolute;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet .panel{position:absolute;inset:auto 0 0 0;max-height:88%;overflow-y:auto;background:var(--s1);border-radius:26px 26px 0 0;border-top:1px solid var(--line-2);padding:10px 20px 28px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line-2);margin:4px auto 14px}
.panel h3{margin:18px 0 10px;font-size:15px;color:var(--t3);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:15px}
.kv dt{color:var(--t3)}.kv dd{margin:0;overflow-wrap:anywhere}
.sw{width:52px;height:32px;border-radius:999px;background:var(--s3);position:relative;flex:none;border:1px solid var(--line-2)}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--t3);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(-20px);background:#fff}
.opt{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .info .name{font-size:16px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:32px;padding:0 12px;border-radius:9px;background:var(--s2);border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--t2)}
.pill b{color:var(--t1);font-family:var(--f-lat)}
.more{color:var(--accent-text);font-size:14.5px;font-weight:600}
.desc{font-size:15px;line-height:1.75;color:var(--t2);margin:0}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* أضف */
.add-in{display:flex;gap:10px}
.add-in .search{flex:1}
.detect{margin-top:14px;padding:16px;border-radius:18px;background:var(--s2);border:1px solid var(--line-2);display:grid;gap:12px}
.detect .top{display:flex;gap:14px;align-items:center}
.samples{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* صفحة المصدر */
.src-head{display:grid;gap:16px;padding:8px 18px 0}
.src-id{display:flex;gap:16px;align-items:center}
.src-id .kind{font-size:14px;font-weight:700;color:var(--accent-text)}
.src-id h2{margin:2px 0 0;font-size:28px;font-weight:700}
.src-id .from{font-size:14px;color:var(--t2);margin-top:5px}
.src-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px;margin-top:14px}
.src-tabs button{height:50px;padding:0 14px;font-size:16px;font-weight:600;color:var(--t3);border-bottom:2px solid transparent}
.src-tabs button[aria-selected="true"]{color:var(--t1);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;padding:16px 18px 120px}
.card{display:grid;gap:8px;min-width:0}
.cover{aspect-ratio:2/3;border-radius:14px;position:relative;overflow:hidden;border:1px solid var(--line);max-width:100%}
.cover .ar{position:absolute;inset:auto 8px 10px 8px;font-weight:700;font-size:15px;line-height:1.35;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.8);color:#fff}
.cover .ch{position:absolute;top:8px;right:8px;height:24px;padding:0 8px;border-radius:7px;background:rgba(8,7,12,.78);font:700 12.5px var(--f-lat);display:grid;place-items:center;color:#fff}
.cover .new{position:absolute;top:8px;left:8px;height:24px;padding:0 8px;border-radius:7px;background:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center}
.card .t{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:13px;color:var(--t3);margin-top:-3px}

/* زر عائم */
.fab{position:absolute;left:18px;bottom:22px;z-index:6}
.fab .btn{height:56px;border-radius:18px;padding:0 20px;font-size:16px;box-shadow:0 14px 32px rgba(143,92,255,.35)}

/* ── الكمبيوتر: نفس الهوية، والتوزيع يتغير (قانون ≥1024) ── */
@container app (min-width:1000px){
  .topbar{padding:14px 36px}
  .topbar .title{font-size:26px}
  .pad,.tabs,.chips{padding-inline:36px}
  .needs{margin-inline:36px;width:calc(100% - 72px)}
  .hub-sum,.hero{margin-inline:36px}
  .grp-t{margin-inline:36px}
  .shell{display:grid;grid-template-columns:minmax(0,1fr) 420px;align-items:start}
  .side{position:sticky;top:73px;align-self:start;border-inline-start:1px solid var(--line);padding:22px 26px 40px;background:var(--bg-raised);min-height:calc(100% - 73px)}
  .secs{grid-template-columns:repeat(2,minmax(0,1fr));padding:16px 36px 60px;align-items:start}
  .prov{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 36px}
  .rows-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 36px 60px}
  .rows-grid .row{border:1px solid var(--line);border-radius:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));padding:20px 36px 60px;gap:22px 18px}
  .src-head{grid-template-columns:auto minmax(0,1fr);align-items:center;padding:16px 36px 0}
  .src-tabs{padding:0 36px}
  .fab{display:none}
  .stats{grid-template-columns:repeat(4,1fr)}
}
@container app (min-width:1600px){
  .shell{grid-template-columns:minmax(0,1fr) 460px}
  .secs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .prov{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rows-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container app (max-width:999px){ .side{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage" dir="rtl" lang="ar">
  <div class="ctl">
    <h1>تصور إضافات فانتارا<small>بيانات حقيقية من أجهزتك. اضغط الصفوف، واسحب المقبض لترتيب الأولوية، وجرّب «أضف».</small></h1>
    <div class="seg" id="devices" role="group" aria-label="المقاس">
      <button id="dev-m" data-dev="m" aria-pressed="true">الجوال ‎412</button>
      <button id="dev-1366" data-dev="1366" aria-pressed="false">كمبيوتر ‎1366</button>
      <button id="dev-1920" data-dev="1920" aria-pressed="false">كمبيوتر ‎1920</button>
    </div>
  </div>
  <div class="screens" id="screens" role="group" aria-label="الشاشة"></div>
  <p class="note" id="note"></p>
  <div class="viewport" id="viewport"><div class="device" id="device"><div class="app" id="app" dir="rtl" lang="ar"></div></div></div>
</div>

<script>
(function(){
const I={
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

manifest:{label:'تفاصيل Torrentio',note:'ورقة منفيست: ما تقدمه، والأنواع، و«اضبط»، وموقعها في الأولوية، وإظهار صفوفها في الرئيسية، ونسخ الرابط. الوصف الطويل مقصوص بـ«المزيد» بدل جدار النص.',

ext:{label:'تفاصيل إضافة مانجا',note:'ورقة إضافة Mihon: الصحة، ومصادرها الداخلية بمفتاح لكل واحد (إخفاء بلا حذف)، وإعداداتها، وفتحها في المتصفح ومسح الكوكي، وأصلها وتوقيعها.',

 <section><div class="sec-h"><h2>معطلة<span class="c num">1</span></h2></div><div class="list">${needs.broken.map(n=>{const x=find(n.s,n.id);return `<div class="row" data-open="${n.s}:${n.id}">${logo(x.logo)}<div class="info"><div class="name">${esc(x.name)}</div><div class="meta" style="white-space:normal">${esc(n.why)}</div></div><button class="btn sm ghost">افحص</button></div>`}).join('')}</div></section>
 <section><div class="sec-h"><h2>تحقق مطلوب<span class="c num">1</span></h2></div><div class="list">${needs.verify.map(n=>{const x=find(n.s,n.id);return `<div class="row" data-open="${n.s}:${n.id}">${logo(x.logo)}<div class="info"><div class="name lat" style="text-align:right">${esc(x.name)}</div><div class="meta" style="white-space:normal">${esc(n.why)}</div></div><button class="btn sm primary">تحقق</button></div>`}).join('')}</div></section>
 <section><div class="sec-h"><h2>تحديثات<span class="c num">3</span></h2><button class="btn sm primary" data-act="updall">حدّث الكل</button></div><div class="list">${needs.updates.map(n=>{const x=find(n.s,n.id);return `<div class="row">${logo(x.logo)}<div class="info"><div class="name lat" style="text-align:right">${esc(x.name)}</div><div class="meta"><span class="lat">${n.from} ← ${n.to}</span><span class="sep">·</span>${P[x.p].name}</div></div><button class="inst up" data-inst>حدّث</button></div>`}).join('')}</div></section>
 </div>`},
source:{label:'صفحة المصدر',note:'داخل المصدر نفسه (Team X): هوية واضحة، ومن أي إضافة ومستودع جاء، و«يعمل» تظهر فقط لما يكون شغال فعلًا. البحث داخل المصدر، والأغلفة أكبر، ورقم آخر فصل على الغلاف، و«جديد» لما وصل بآخر دورة.',

 <div class="src-head"><div class="src-id">${logo(L('X','#0d0d10','#ff3b4a'),'xl')}<div><div class="kind">مصدر مانجا · الأولوية 1</div><h2 class="lat" style="text-align:right">Team X</h2><div class="from">من إضافة <span class="lat">Team X</span> · <span class="lat">Mihon</span> · مستودع <span class="lat">Keiyoushi</span></div><div class="state ok" style="font-size:14.5px">يعمل · ‎0.3 ث</div></div></div>

 <div class="grid">${covers.map(c=>`<div class="card"><div class="cover" style="background:linear-gradient(160deg,hsl(${c.h} 55% 38%),hsl(${(c.h+40)%360} 60% 14%))"><span class="ch">فصل ${c.ch}</span>${c.new?'<span class="new">جديد</span>':''}<span class="ar">${esc(c.ar)}</span></div><div class="t">${esc(c.ar)}</div><div class="s lat" style="text-align:right">${esc(c.en)}</div></div>`).join('')}</div>`},
add:{label:'أضف',note:'«أضف» يكتشف نوع الرابط قبل ما يضيف ويقولك وش لقى بالضبط: مستودع (قائمة تختار منها) أو منفيست (إضافة واحدة) أو موقع. جرّب الأمثلة تحت الحقل.',

function pcard(k,inst,repos,avail){const p=P[k];return `<button class="pcard" data-go="${k==='stremio'?'stremio':'provider'}"><span class="pi" style="background:color-mix(in srgb,${p.tint} 16%,transparent);color:${p.tint}">${I[p.icon]}</span><span class="info"><h3><span class="${k==='site'?'':'lat'}">${p.name}</span>${kindTag(p.kind)}</h3><p>${p.ar}</p><span class="nums"><span><b class="num">${inst}</b>مثبتة</span>${p.kind==='repo'?`<span><b class="num">${repos}</b>${repos===1?'مستودع':'مستودعات'}</span><span><b class="num">${avail.toLocaleString('en')}</b>متاحة</span>`:''}</span></span>${I.chev}</button>`}
function detail(sec,id,full){const x=find(sec,id),p=P[x.p];
 const head=`<div style="display:flex;gap:16px;align-items:center">${logo(x.logo,'lg')}<div style="min-width:0"><div style="font-size:24px;font-weight:700" class="${/[a-z]/i.test(x.name)?'lat':''}">${esc(x.name)}</div><div class="meta" style="font-size:14.5px">${origin(x)}</div>${state(x)}</div></div>
 <div class="actions" style="margin-top:16px"><button class="btn ghost sm">${x.off?'شغّلها':'أوقفها'}</button>${x.conf?'<button class="btn primary sm">اضبط</button>':''}${x.st==='warn'&&/تحديث/.test(x.stx)?'<button class="btn primary sm">حدّث</button>':''}<button class="btn quiet sm" style="color:var(--bad)">احذف</button></div>`;
 const rank=S[sec].items.indexOf(x)+1;
 if(x.p==='stremio')return `${head}<h3>ما تقدمه</h3><div class="pills">${x.res.map(r=>`<span class="pill">${r}</span>`).join('')}<span class="pill">أفلام</span><span class="pill">مسلسلات</span>${x.id==='torrentio'?'<span class="pill">أنمي</span>':''}<span class="pill">معرّفات <b>IMDb</b>${x.id==='torrentio'?' و<b>Kitsu</b>':''}</span>${x.cats?`<span class="pill"><b>${x.cats}</b> كتالوج</span>`:''}</div>
 <h3>الأولوية</h3><div class="opt"><div class="info"><div class="name">رقم ${rank} من ${S.stremio.items.length}</div><div class="meta">روابطها تظهر ${rank===1?'أول':'بعد '+S.stremio.items[0].name} في ورقة السيرفرات</div></div><button class="btn sm ghost" data-go="stremio">رتّب</button></div>
 ${x.res.includes('كتالوج')?'<div class="opt"><div class="info"><div class="name">صفوفها في الرئيسية</div><div class="meta">إخفاؤها يبقي بياناتها للبحث والتفاصيل</div></div><span class="sw" role="switch" aria-checked="true" tabindex="0"></span></div>':''}
 <h3>الوصف</h3><p class="desc clamp" id="desc">Provides torrent streams from scraped torrent providers. Currently supports YTS, EZTV, RARBG, 1337x, ThePirateBay, KickassTorrents, TorrentGalaxy, NyaaSi, AnimeTosho, TokyoTosho and more. To configure providers, debrid support and other settings visit torrentio.strem.fun</p><button class="more" data-more>المزيد</button>
 <h3>المعلومات</h3><dl class="kv"><dt>النوع</dt><dd>${kindTag('mani')} إضافة واحدة برابطها</dd><dt>الإصدار</dt><dd class="lat" style="text-align:right">${x.v}</dd><dt>الرابط</dt><dd class="lat" style="text-align:right">https://torrentio.strem.fun/manifest.json</dd></dl>
 <div class="actions" style="margin-top:14px"><button class="btn ghost sm">انسخ الرابط</button><button class="btn ghost sm">افحص الآن</button></div>`;
 return `${head}<h3>الصحة</h3><dl class="kv"><dt>آخر فحص</dt><dd>${x.st==='ok'?'قبل 12 دقيقة · البحث والأحدث والفصول نجحت':'لم يُفحص بعد'}</dd><dt>الزمن</dt><dd class="num">${x.st==='ok'?x.stx.split('·')[1]:'—'}</dd></dl><div class="actions" style="margin-top:12px"><button class="btn ghost sm">افحص الآن</button></div>
 <h3>المصادر داخل الإضافة</h3>${[[x.name,'عربي',true]].concat(x.id==='mangalek'?[['مانجا ليك (نسخة احتياطية)','عربي',false]]:[]).map(([n,l,on])=>`<div class="opt"><div class="info"><div class="name">${esc(n)}</div><div class="meta">${l}</div></div><span class="sw" role="switch" aria-checked="${on}" tabindex="0" aria-label="إظهار ${esc(n)}"></span></div>`).join('')}
 <h3>إعدادات المصدر</h3><div class="opt"><div class="info"><div class="name">النطاق</div><div class="meta lat" style="text-align:right">${x.id==='teamx'?'teamoney.site':'manga-lek.net'}</div></div><button class="btn sm ghost">غيّر</button></div>
 <div class="opt"><div class="info"><div class="name">افتح في المتصفح</div><div class="meta">لتسجيل الدخول أو حل Cloudflare يدويًا</div></div><button class="btn sm ghost">افتح</button></div>
 <div class="opt"><div class="info"><div class="name">امسح الكوكي</div><div class="meta">لما يعلق التحقق أو تتغير الجلسة</div></div><button class="btn sm ghost">امسح</button></div>
 <h3>الأولوية</h3><div class="opt"><div class="info"><div class="name">رقم ${rank} في المانجا</div><div class="meta">تحديثاتها ${rank===1?'تظهر أول':'بعد '+esc(S[sec].items[0].name)} في آخر التحديثات</div></div><button class="btn sm ghost" data-go="installed">رتّب</button></div>
 <h3>المعلومات</h3><dl class="kv"><dt>النوع</dt><dd>من ${kindTag('repo')} <span class="lat">${esc(x.repo)}</span></dd><dt>المزوّد</dt><dd class="lat" style="text-align:right">${p.name}</dd><dt>الإصدار</dt><dd class="lat" style="text-align:right">${x.v}</dd><dt>التوقيع</dt><dd>موثوق · مطابق للمستودع</dd></dl>
 <div class="actions" style="margin-top:14px"><button class="btn ghost sm" data-go="source">افتح المصدر</button></div>`}
function addSheet(){return `<div class="scrim" data-close></div><div class="panel" role="dialog" aria-label="أضف"><div class="grab"></div>
 <div style="font-size:22px;font-weight:700">أضف</div><p class="explain" style="margin-top:6px">ألصق رابط مستودع أو منفيست أو موقع. نقولك وش هو قبل ما نضيف.</p>
 <div class="add-in" style="margin-top:14px"><label class="search" for="addurl">${I.search}<input id="addurl" class="lat" style="text-align:left" placeholder="https://…"></label><button class="btn ghost">ملف</button></div>
 <div class="samples"><button class="chip" data-sample="repo">مثال: مستودع Mihon</button><button class="chip" data-sample="mani">مثال: منفيست Stremio</button><button class="chip" data-sample="cs">مثال: كود CloudStream</button><button class="chip" data-sample="site">مثال: موقع مانجا</button></div>
 <div id="detect"></div></div>`}
const samples={
 repo:{url:'https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json',html:`<div class="top">${logo(L('K','#1a1530','#bba2ff'))}<div><div style="font-size:17px;font-weight:700">${kindTag('repo')} <span class="lat">Keiyoushi</span> · <span class="lat">Mihon</span></div><div class="meta" style="white-space:normal">قائمة فيها 1,248 إضافة، منها 61 عربية. تضيف المستودع ثم تختار منها.</div></div></div><button class="btn primary">أضف المستودع</button>`},
 mani:{url:'https://torrentio.strem.fun/manifest.json',html:`<div class="top">${logo(L('µ','#10161a','#1fa045'))}<div><div style="font-size:17px;font-weight:700">${kindTag('mani')} <span class="lat">Torrentio</span> · <span class="lat">Stremio</span></div><div class="meta" style="white-space:normal">إضافة واحدة: روابط تورنت لأفلام ومسلسلات وأنمي. قابلة للضبط.</div></div></div><div class="actions"><button class="btn primary">ثبّت</button><button class="btn ghost">اضبطها أولًا</button></div>`},
 cs:{url:'3rabi',html:`<div class="top">${logo(L('3','#13202f','#5aa9ff'))}<div><div style="font-size:17px;font-weight:700">${kindTag('repo')} <span class="lat">3rabi</span> · <span class="lat">CloudStream</span></div><div class="meta" style="white-space:normal">كود قصير لمستودع فيه 38 إضافة عربية (أفلام ومسلسلات وأنمي).</div></div></div><div class="actions"><button class="btn primary">أضف المستودع</button><button class="btn ghost">أضفه وثبّت الكل</button></div>`},
 site:{url:'https://manga-lek.net',html:`<div class="top">${logo(L('M','#f3efe7','#c8102e'))}<div><div style="font-size:17px;font-weight:700">${kindTag('site')} مانجا ليك</div><div class="meta" style="white-space:normal">موقع مانجا يعمل بمحرك Madara مباشرة بلا إضافة. وفيه إضافة Mihon مثبتة للموقع نفسه: نقترح الإضافة لأنها أدق.</div></div></div><div class="actions"><button class="btn ghost">أضف الموقع</button><button class="btn primary" data-go="ext">افتح الإضافة المثبتة</button></div>`}
};

/* ── التشغيل ── */
const app=document.getElementById('app'),dev=document.getElementById('device'),vp=document.getElementById('viewport');
let cur='installed',size='m';
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function render(){dev.querySelector('#sheet')?.remove();app.innerHTML=screens[cur].render();document.getElementById('note').textContent=screens[cur].note;
 document.querySelectorAll('#screens button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===cur)));app.scrollTop=0;bindDrag();}
function fit(){const dims=size==='m'?[412,892]:size==='1366'?[1366,768]:[1920,1080];dev.style.width=dims[0]+'px';dev.style.height=dims[1]+'px';
 dev.classList.toggle('desk',size!=='m');const avail=vp.clientWidth;const s=Math.min(1,avail/dims[0]);dev.style.transform=`scale(${s})`;vp.style.height=(dims[1]*s)+'px';
 document.querySelectorAll('#devices button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.dev===size)));}
document.getElementById('screens').innerHTML=Object.entries(screens).map(([k,v])=>`<button id="scr-${k}" data-s="${k}" aria-pressed="false">${v.label}</button>`).join('');
document.getElementById('screens').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;cur=b.dataset.s;store('cur',cur);render();});
document.getElementById('devices').addEventListener('click',e=>{const b=e.target.closest('[data-dev]');if(!b)return;size=b.dataset.dev;store('size',size);fit();});
window.addEventListener('resize',fit);
dev.addEventListener('click',e=>{
 const go=e.target.closest('[data-go]');if(go&&!e.target.closest('[data-act]')){cur=go.dataset.go;render();return;}
 const sh=e.target.closest('[data-sheet]');if(sh){openSheet(addSheet());return;}
 if(e.target.closest('[data-close]')){const s=dev.querySelector('#sheet');if(cur==='add'){cur='installed';render();}else s?.remove();return;}
 const smp=e.target.closest('[data-sample]');if(smp){const d=samples[smp.dataset.sample];dev.querySelector('#addurl').value=d.url;dev.querySelector('#detect').innerHTML=`<div class="detect">${d.html}</div>`;return;}
 const ins=e.target.closest('[data-inst]');if(ins){const up=ins.classList.contains('up');ins.className='inst busy';ins.innerHTML=(up?'يحدّث':'يثبّت')+'<i></i>';setTimeout(()=>{ins.className='inst have';ins.textContent='مثبتة';},1500);return;}
 const act=e.target.closest('[data-act]');if(act){e.stopPropagation();act.textContent='يحدّث 3…';setTimeout(()=>{act.textContent='تم';},1400);return;}
 const sw=e.target.closest('.sw');if(sw){sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'));return;}
 const more=e.target.closest('[data-more]');if(more){const d=dev.querySelector('#desc');d.classList.toggle('clamp');more.textContent=d.classList.contains('clamp')?'المزيد':'أقل';return;}
 const row=e.target.closest('[data-open]');if(row&&!e.target.closest('.handle')){const [s,id]=row.dataset.open.split(':');
  const side=app.querySelector('#side');if(side&&getComputedStyle(side).display!=='none'){side.innerHTML=detail(s,id);return;}
  openSheet(`<div class="scrim" data-close></div><div class="panel" role="dialog"><div class="grab"></div>${detail(s,id)}</div>`);}
});
function openSheet(html){dev.querySelector('#sheet')?.remove();const d=document.createElement('div');d.className='sheet open';d.id='sheet';d.innerHTML=html;dev.appendChild(d);}

/* سحب الترتيب بالمقبض (لمس وفأرة) */
function bindDrag(){app.querySelectorAll('.handle').forEach(h=>{h.onpointerdown=ev=>{
 const row=h.closest('.row'),list=row.parentElement,sec=row.dataset.sec;if(!sec)return;ev.preventDefault();h.setPointerCapture(ev.pointerId);
 const scale=dev.getBoundingClientRect().width/dev.offsetWidth;let startY=ev.clientY;row.classList.add('drag');
 const move=e=>{const dy=(e.clientY-startY)/scale;row.style.transform=`translateY(${dy}px)`;const r=row.getBoundingClientRect();
  const prev=row.previousElementSibling,next=row.nextElementSibling;
  if(next&&r.top+r.height/2>next.getBoundingClientRect().top+next.getBoundingClientRect().height/2){list.insertBefore(next,row);startY+=next.offsetHeight*scale;row.style.transform=`translateY(${(e.clientY-startY)/scale}px)`;}
  else if(prev&&r.top+r.height/2<prev.getBoundingClientRect().top+prev.getBoundingClientRect().height/2){list.insertBefore(row,prev);startY-=prev.offsetHeight*scale;row.style.transform=`translateY(${(e.clientY-startY)/scale}px)`;}};
 const up=()=>{h.removeEventListener('pointermove',move);row.classList.remove('drag');row.style.transform='';
  const order=[...list.querySelectorAll('.row')].map(r=>r.dataset.id);S[sec].items.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  list.querySelectorAll('.rank').forEach((n,i)=>{n.textContent=i+1;n.classList.toggle('top',i===0);});};
 h.addEventListener('pointermove',move);h.addEventListener('pointerup',up,{once:true});h.addEventListener('pointercancel',up,{once:true});};});}

cur=screens[load('cur')]?load('cur'):'installed';size=['m','1366','1920'].includes(load('size'))?load('size'):'m';
render();fit();
})();
</script>
