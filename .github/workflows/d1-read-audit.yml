name: D1 read audit

# Temporary read-only diagnostic. Remove after identifying and verifying the leak.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Deploy sync worker']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'Meshal515/VANTARA'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query D1 insights without bound values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p d1-audit
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" \
            | jq -r '.result[].name' > d1-audit/database-names.txt
          test -s d1-audit/database-names.txt
          while IFS= read -r database; do
            [ -n "$database" ] || continue
            safe=$(printf '%s' "$database" | sha256sum | cut -c1-12)
            npx --yes wrangler@4 d1 insights "$database" --timePeriod=2d --sort-type=sum --sort-by=reads --limit=100 --json > "d1-audit/$safe-reads.json"
            npx --yes wrangler@4 d1 insights "$database" --timePeriod=2d --sort-type=sum --sort-by=count --limit=100 --json > "d1-audit/$safe-count.json"
            npx --yes wrangler@4 d1 insights "$database" --timePeriod=1h --sort-type=sum --sort-by=reads --limit=100 --json > "d1-audit/$safe-hour-reads.json"
            printf '%s %s\n' "$safe" "$database" >> d1-audit/map.txt
          done < d1-audit/database-names.txt
      - name: Summarize counts and scanned rows
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const mapping = readFileSync('d1-audit/map.txt', 'utf8').trim().split('\n');
          const report = [];
          for (const line of mapping) {
            const [id, name] = line.split(' ');
            const read = (suffix) => {
              const raw = readFileSync(`d1-audit/${id}-${suffix}.json`, 'utf8');
              const parsed = JSON.parse(raw.slice(raw.indexOf('[')));
              return Array.isArray(parsed) ? parsed : parsed.result ?? [];
            };
            const rows = new Map();
            for (const item of [...read('reads'), ...read('count')]) {
              const query = String(item.query ?? '').replace(/'([^']|'')*'/g, '?').replace(/\s+/g, ' ').trim();
              rows.set(query, {
                query: query.slice(0, 420),
                calls: Number(item.numberOfTimesRun ?? 0),
                totalRowsRead: Number(item.totalRowsRead ?? 0),
                avgRowsRead: Number(item.avgRowsRead ?? 0),
              });
            }
            report.push({ database: name, queries: [...rows.values()].sort((a, b) => b.totalRowsRead - a.totalRowsRead) });
            const hour = read('hour-reads').map((item) => ({
              query: String(item.query ?? '').replace(/'([^']|'')*'/g, '?').replace(/\s+/g, ' ').trim().slice(0, 420),
              calls: Number(item.numberOfTimesRun ?? 0),
              totalRowsRead: Number(item.totalRowsRead ?? 0),
              avgRowsRead: Number(item.avgRowsRead ?? 0),
            }));
            report[report.length - 1].lastHour = hour;
          }
          writeFileSync('d1-audit/report.json', JSON.stringify(report, null, 2));
          for (const database of report) {
            console.log(`Database ${database.database}: top rows_read over 2d`);
            for (const row of database.queries.slice(0, 25)) console.log(JSON.stringify(row));
          }
          NODE
      - name: Probe actual indexed reads on production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const root = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          const databases = await (await fetch(`${root}?name=vantara`, { headers })).json();
          const database = databases.result?.find((row) => row.name === 'vantara');
          if (!database) throw new Error('D1 vantara not found');
          const query = async (sql, params = []) => {
            const response = await fetch(`${root}/${database.uuid}/query`, {
              method: 'POST', headers, body: JSON.stringify({ sql, params }),
            });
            const payload = await response.json();
            if (!response.ok || !payload.success || !payload.result?.[0]?.success) {
              throw new Error(`D1 read-only probe failed: HTTP ${response.status}`);
            }
            return payload.result[0];
          };
          // This is the documented owner ID, not a discovered or printed user record.
          const userId = 'bedcf897-a6f0-4730-b757-402b14891ca5';
          const cases = [
            ['chapter_marks',
              'SELECT user_id, chapter_key, series_ref, read, updated_at, rev FROM chapter_marks WHERE rev > ? AND user_id = ? ORDER BY rev LIMIT 500',
              [0, userId]],
            ['activity_receipts',
              'SELECT event_id, user_id, delivered_at, seen_at, rev FROM activity_receipts WHERE rev > ? AND rowid IN (SELECT rowid FROM activity_receipts WHERE user_id = ? AND rev > ? UNION SELECT r.rowid FROM activity_receipts r JOIN activity a ON a.id = r.event_id WHERE a.actor_id = ? AND r.rev > ?) ORDER BY rev LIMIT 500',
              [0, userId, 0, userId, 0]],
            ['translation_owner',
              'SELECT created_by FROM translation_creator_totals ORDER BY page_count DESC, first_at LIMIT 1', []],
          ];
          const report = [];
          for (const [name, sql, params] of cases) {
            const result = await query(sql, params);
            const plan = await query(`EXPLAIN QUERY PLAN ${sql}`, params);
            report.push({ name, rowsRead: result.meta?.rows_read ?? null,
              returned: result.results?.length ?? 0, plan: plan.results?.map((row) => row.detail) ?? [] });
          }
          writeFileSync('d1-audit/probe.json', JSON.stringify(report, null, 2));
          for (const row of report) console.log(JSON.stringify(row));
          NODE
      - name: Audit account attribution without modifying D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const root = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          const databases = await (await fetch(`${root}?name=vantara`, { headers })).json();
          const database = databases.result?.find((row) => row.name === 'vantara');
          if (!database) throw new Error('D1 vantara not found');
          const query = async (sql, params = []) => {
            const response = await fetch(`${root}/${database.uuid}/query`, {
              method: 'POST', headers, body: JSON.stringify({ sql, params }),
            });
            const data = await response.json();
            if (!response.ok || !data.success || !data.result?.[0]?.success) throw new Error(`D1 query failed: HTTP ${response.status}`);
            return data.result[0].results ?? [];
          };
          const accounts = await query("SELECT user_id, username FROM accounts WHERE lower(username) IN ('ngm', 'd7m', 'dahmi')");
          const report = { accounts: accounts.map(({ username }) => username), rows: {}, exactMatches: [] };
          const histories = {};
          for (const { user_id: id, username } of accounts) {
            const views = await query('SELECT series_ref, chapter_number, viewed_at, rev FROM work_views WHERE user_id = ? AND removed = 0 LIMIT 2000', [id]);
            const libraries = await query('SELECT series_ref, added_at, rev FROM library WHERE user_id = ? AND removed = 0 LIMIT 2000', [id]);
            const marks = await query('SELECT series_ref, chapter_key, updated_at, rev FROM chapter_marks WHERE user_id = ? AND read = 1 LIMIT 4000', [id]);
            const publicViews = await query('SELECT series_ref FROM public_work_views WHERE user_id = ? AND removed = 0 LIMIT 2000', [id]);
            histories[username.toLowerCase()] = views;
            report.rows[username] = { views: views.length, publicViews: publicViews.length,
              // Account owner may review the private artifact; raw titles and refs never enter Actions logs.
              history: views, library: libraries, marks: marks, publicRefs: publicViews };
          }
          const owner = histories.ngm ?? [];
          const friend = histories.d7m ?? histories.dahmi ?? [];
          for (const a of owner) for (const b of friend) {
            if (a.series_ref === b.series_ref && a.viewed_at === b.viewed_at && a.chapter_number === b.chapter_number) {
              report.exactMatches.push({ seriesRef: a.series_ref, viewedAt: a.viewed_at, chapterNumber: a.chapter_number,
                ownerRev: a.rev, friendRev: b.rev });
            }
          }
          writeFileSync('d1-audit/account-attribution.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify({ accountNames: report.accounts, counts: Object.fromEntries(Object.entries(report.rows).map(([k, v]) => [k, {
            views: v.views, library: v.library.length, marks: v.marks.length, publicViews: v.publicViews,
          }])), exactViewMatches: report.exactMatches.length,
            matchedRefs: report.exactMatches.map((x) => createHash('sha256').update(x.seriesRef).digest('hex').slice(0, 12)) }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: d1-read-audit
          path: |
            d1-audit/report.json
            d1-audit/probe.json
            d1-audit/account-attribution.json
          retention-days: 7
