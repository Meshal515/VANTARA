name: VANTARA CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Audit baseline and affected systems
    runs-on: ubuntu-latest
    outputs:
      audit_base: ${{ steps.scope.outputs.audit_base }}
      backend: ${{ steps.scope.outputs.backend }}
      translation: ${{ steps.scope.outputs.translation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve trusted audit and test baselines
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Stable 224's main SHA passed the previous full-history CI.
          fallback=ccb5799f168a243b7701eaa5b1ac7eb74cc717ca
          git cat-file -e "$fallback^{commit}"
          audit="$fallback"
          if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deep-ci.yml/runs?branch=main&status=completed&per_page=1" > /tmp/deep.json; then
            result=$(jq -r '.workflow_runs[0].conclusion // "none"' /tmp/deep.json)
            if [ "$result" = success ]; then
              audit=$(jq -er '.workflow_runs[0].head_sha' /tmp/deep.json)
            elif [ "$result" != none ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "Latest Deep CI concluded $result; Stable publication blocked until a successful full audit."
              exit 1
            fi
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            echo 'Cannot establish Deep CI status on main; fail closed.'
            exit 1
          fi
          git cat-file -e "$audit^{commit}"
          git merge-base --is-ancestor "$audit" HEAD || audit="$fallback"
          git merge-base --is-ancestor "$audit" HEAD
          echo "audit_base=$audit" >> "$GITHUB_OUTPUT"
          # Compare against a successful main run, not just the preceding push:
          # a failed earlier change must not be skipped by a later unrelated push.
          baseline="$fallback"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=30" > /tmp/ci-runs.json
          while read -r sha; do
            if [ "$sha" != "$(git rev-parse HEAD)" ] && git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
              baseline="$sha"
              break
            fi
          done < <(jq -r '.workflow_runs[].head_sha' /tmp/ci-runs.json)
          git diff --no-renames --name-only "$baseline" HEAD > /tmp/changed
          backend=false
          translation=false
          # Conservative allowlist: anything outside isolated client/docs paths
          # runs full live backend and translation tests, including shared contracts,
          # lockfiles, tools, CI, and unrecognized/new directories.
          while IFS= read -r path; do
            case "$path" in
              docs/*|*.md|android/*|apps/web/*|apps/desktop/*|extensions/*|spike/*) ;;
              *) backend=true; translation=true ;;
            esac
          done < /tmp/changed
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "translation=$translation" >> "$GITHUB_OUTPUT"
          echo "Audit baseline: $audit; test baseline: $baseline; backend=$backend; translation=$translation"

  node:
    needs: plan
    name: Node backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_USER: vantara
      POSTGRES_PASSWORD: vantara-ci-password
      POSTGRES_DB: vantara
      UCHIYOMI_DB: uchiyomi
      PUBLIC_ORIGIN: http://127.0.0.1:8080
      SESSION_SECRET: ci-session-secret-ci-session-secret-1234
      VANTARA_IDENTITY_SECRET: ci-identity-secret-ci-identity-secret-12
      TUNNEL_TOKEN: ci-unused-tunnel-token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan new Git commits since audited baseline for credential signatures
        shell: bash
        env:
          AUDITED_BASE: ${{ needs.plan.outputs.audit_base }}
        run: |
          set -euo pipefail
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]+'
          git rev-list HEAD --not "$AUDITED_BASE" > /tmp/credential-commits
          mapfile -t commits < /tmp/credential-commits
          echo "Scanning ${#commits[@]} commits"
          for ((i=0; i<${#commits[@]}; i+=64)); do
            set +e
            git grep -lI -E -e "$pattern" "${commits[@]:i:64}" > /tmp/history-credential-scan 2>/tmp/history-credential-error
            status=$?
            set -e
            case "$status" in
              0) cat /tmp/history-credential-scan; echo 'Credential-like material found (paths only).'; exit 1 ;;
              1) ;;
              *) echo "Credential scan failed with status $status"; exit "$status" ;;
            esac
          done

      - name: Reject tracked secret files
        shell: bash
        run: |
          bad="$(
            git ls-files |
              grep -E '(^|/)(\.env($|\.)|\.dev\.vars$|id_rsa$|.*\.(pem|key|p12|pfx|jks)$)' |
              grep -vE '(^|/)\.env\.example$' || true
          )"
          if [ -n "$bad" ]; then
            echo "Secret-like tracked files are not allowed:"
            echo "$bad"
            exit 1
          fi

      - name: Scan production source for credential signatures
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git grep -lI -E -e '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]+' -- \
            ':!*.test.*' ':!**/tests/**' ':!.env.example' > /tmp/source-credential-scan 2>&1
          scan_status=$?
          set -e
          case "$scan_status" in
            0)
              cat /tmp/source-credential-scan
              echo 'Credential-like material found in tracked production source.'
              exit 1
              ;;
            1) ;;
            *)
              cat /tmp/source-credential-scan
              echo "Credential source scan itself failed with status $scan_status."
              exit "$scan_status"
              ;;
          esac
          grep -q '__D1_DATABASE_ID__' services/sync-worker/wrangler.toml

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Repository safety invariants
        run: pnpm test:safety

      - name: فحص منع نشر حزمة أندرويد ناقصة
        run: python3 tools/android-bundle-test.py

      - name: Validate stable release metadata and platform update boundaries
        run: node --test tools/release-manifest-validation.test.mjs tools/unified-windows-manifest.test.mjs

      - name: Validate operational scripts
        run: node --check services/sync-worker/verify.mjs

      - name: Clean database bootstrap + backup/restore
        if: needs.plan.outputs.backend == 'true'
        run: sh infra/test-db-bootstrap.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint repository
        run: pnpm lint

      - name: Build repository
        run: pnpm build

      - name: Typecheck repository
        run: pnpm typecheck

      - name: Test repository
        run: pnpm test

      - name: Start live Postgres and Uchiyomi
        if: needs.plan.outputs.backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          compose='docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml'
          $compose down -v --remove-orphans >/dev/null 2>&1 || true
          $compose up -d postgres uchiyomi

          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/livez >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              $compose ps
              $compose logs postgres uchiyomi
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8080/livez >/dev/null

      - name: Create temporary Uchiyomi admin
        if: needs.plan.outputs.backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST http://127.0.0.1:8080/api/setup             -H 'Content-Type: application/json'             --data '{"username":"mansour","password":"ci-only-password-1234567890123456","displayName":"CI Admin"}'

      - name: Probe Uchiyomi token self-revocation
        if: needs.plan.outputs.backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          login_json="$(curl -fsS -X POST http://127.0.0.1:8080/auth/login             -H 'Content-Type: application/json'             --data '{"username":"mansour","password":"ci-only-password-1234567890123456"}')"
          session_token="$(printf '%s' "$login_json" | jq -er '.accessToken')"

          minted_json="$(curl -fsS -X POST http://127.0.0.1:8080/api/tokens             -H "Authorization: Bearer $session_token"             -H 'Content-Type: application/json'             --data '{"name":"vantara-self-revoke-probe","scopes":["read","write"],"expiresInDays":1}')"
          token_id="$(printf '%s' "$minted_json" | jq -er '.id')"
          token="$(printf '%s' "$minted_json" | jq -er '.token')"

          curl -fsS http://127.0.0.1:8080/auth/me             -H "Authorization: Bearer $token" >/dev/null

          revoke_status="$(curl -sS -o /tmp/revoke-body -w '%{http_code}'             -X DELETE "http://127.0.0.1:8080/api/tokens/$token_id"             -H "Authorization: Bearer $token")"
          case "$revoke_status" in
            2*) ;;
            *) cat /tmp/revoke-body; echo "self-revoke returned HTTP $revoke_status"; exit 1 ;;
          esac

          after_status="$(curl -sS -o /tmp/after-revoke -w '%{http_code}'             http://127.0.0.1:8080/auth/me             -H "Authorization: Bearer $token")"
          test "$after_status" = '401'

      - name: Apply VANTARA Postgres migrations
        if: needs.plan.outputs.backend == 'true'
        env:
          DATABASE_URL: postgres://vantara:vantara-ci-password@127.0.0.1:5433/vantara
        run: pnpm --filter @vantara/db migrate

      - name: Smoke boot actual API server
        if: needs.plan.outputs.backend == 'true'
        shell: bash
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: '3100'
          DATABASE_URL: postgres://vantara:vantara-ci-password@127.0.0.1:5433/vantara
          UCHIYOMI_URL: http://127.0.0.1:8080
          SESSION_SECRET: ci-session-secret-ci-session-secret-1234
          VANTARA_IDENTITY_SECRET: ci-identity-secret-ci-identity-secret-12
          COOKIE_SECURE: 'false'
          VANTARA_DISABLE_JOBS: 'true'
          LOG_LEVEL: error
        run: |
          set -euo pipefail
          pnpm --filter @vantara/api start >/tmp/vantara-api.log 2>&1 &
          api_pid=$!
          cleanup_api() { kill "$api_pid" >/dev/null 2>&1 || true; }
          trap cleanup_api EXIT INT TERM

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/livez >/dev/null               && curl -fsS http://127.0.0.1:3100/healthz >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/vantara-api.log
              exit 1
            fi
            sleep 1
          done

      - name: Exercise live dependency restarts
        if: needs.plan.outputs.backend == 'true'
        shell: bash
        env:
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: '3101'
          DATABASE_URL: postgres://vantara:vantara-ci-password@127.0.0.1:5433/vantara
          UCHIYOMI_URL: http://127.0.0.1:8080
          SESSION_SECRET: ci-session-secret-ci-session-secret-1234
          VANTARA_IDENTITY_SECRET: ci-identity-secret-ci-identity-secret-12
          COOKIE_SECURE: 'false'
          VANTARA_DISABLE_JOBS: 'true'
          LOG_LEVEL: error
        run: |
          set -euo pipefail
          compose='docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml'
          node apps/api/dist/server.js >/tmp/vantara-restart-api.log 2>&1 &
          api_pid=$!
          cleanup_api() { kill "$api_pid" >/dev/null 2>&1 || true; }
          trap cleanup_api EXIT INT TERM

          wait_ready() {
            for attempt in $(seq 1 45); do
              if ! kill -0 "$api_pid" >/dev/null 2>&1; then
                echo 'API process exited during dependency restart probe.'
                cat /tmp/vantara-restart-api.log
                return 1
              fi
              if curl -fsS http://127.0.0.1:3101/healthz >/dev/null; then
                return 0
              fi
              sleep 1
            done
            cat /tmp/vantara-restart-api.log
            $compose ps
            $compose logs postgres uchiyomi
            return 1
          }

          wait_ready

          # Same API process must reconnect after PostgreSQL disappears/restarts.
          $compose restart postgres
          wait_ready

          # Same API process must recover when the content upstream restarts.
          $compose restart uchiyomi
          wait_ready

      - name: Run live API integration
        if: needs.plan.outputs.backend == 'true'
        env:
          DATABASE_URL: postgres://vantara:vantara-ci-password@127.0.0.1:5433/vantara
          UCHIYOMI_URL: http://127.0.0.1:8080
          TEST_USERNAME: mansour
          TEST_PASSWORD: ci-only-password-1234567890123456
          VANTARA_REQUIRE_LIVE_INTEGRATION: 'true'
        run: pnpm --filter @vantara/api test

      - name: Stop live integration services
        if: always() && needs.plan.outputs.backend == 'true'
        shell: bash
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml down -v --remove-orphans

  translation-worker:
    needs: plan
    if: needs.plan.outputs.translation == 'true'
    name: Translation worker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: services/translation-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/translation-worker/requirements.txt
            services/translation-worker/requirements-dev.txt

      - name: Install worker dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Noto test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          test -f /usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf

      - name: Verify RAQM support
        run: |
          python - <<'PY'
          from PIL import features
          assert features.check('raqm'), 'Pillow was installed without RAQM'
          print('RAQM OK')
          PY

      - name: Lint worker
        run: ruff check vantara_worker tests

      # الأوزان (~430MB) ببصماتها في models.py: تُنزَّل مرة وتُخزَّن بمفتاح البصمات
      - name: Cache model weights
        id: models
        uses: actions/cache@v4
        with:
          path: ~/.cache/vantara/models
          key: vantara-models-${{ hashFiles('services/translation-worker/vantara_worker/models.py') }}

      - name: Download model weights
        if: steps.models.outputs.cache-hit != 'true'
        run: python -m vantara_worker.cli models

      - name: Run translation tests (11 real pages are mandatory)
        env:
          VANTARA_REQUIRE_MODELS: '1'
        run: pytest -q
