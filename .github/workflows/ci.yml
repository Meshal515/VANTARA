name: VANTARA CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  translation-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/translation-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/translation-worker/requirements.txt
            services/translation-worker/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify RAQM support
        run: |
          python - <<'PY'
          from PIL import features
          assert features.check('raqm'), 'Pillow was installed without RAQM; Arabic typesetting would be unsafe'
          print('RAQM OK')
          PY
      - run: pytest -q
