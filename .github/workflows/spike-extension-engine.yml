name: Spike — local extension engine (debug APK)

# Spike معزول تمامًا:
#
#  - لا يلمس `android-release.yml` ولا قشرة Capacitor في `android/`.
#  - **debug فقط**: لا توقيع، فلا يقرأ سرًّا واحدًا — لا keystore ولا Cloudflare.
#  - يُشغَّل يدويًّا، أو عند تغيير ملفات الـspike وحدها.
#
# غرضه واحد: إخراج APK قابل للتثبيت يدويًّا لإثبات أو نفي المحرك المحلي.

on:
  workflow_dispatch:
  push:
    paths:
      - 'spike/extension-engine/**'
      - '.github/workflows/spike-extension-engine.yml'

permissions:
  contents: read

concurrency:
  group: spike-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # لقطة ثابتة حديثة: تجدد الروابط المنشورة بدل الاعتماد على أصول إصدار محذوفة.
      KEIYOUSHI_INDEX_COMMIT: e38245f4ecc7bd1858551c2ea149dbf8129dbad4
      # Owner-approved diagnostic batch: 15 Arabic SAFE, Arabic MangaDex only,
      # and one general Arabic NSFW source behind an in-app acknowledgement.
      VANTARA_SOURCE_PACKAGES: >-
        eu.kanade.tachiyomi.extension.ar.mangalek,
        eu.kanade.tachiyomi.extension.ar.mangaspark,
        eu.kanade.tachiyomi.extension.ar.azora,
        eu.kanade.tachiyomi.extension.ar.mangaswat,
        eu.kanade.tachiyomi.extension.ar.teamx,
        eu.kanade.tachiyomi.extension.ar.manga3asq,
        eu.kanade.tachiyomi.extension.ar.ariatoon,
        eu.kanade.tachiyomi.extension.ar.comicverse,
        eu.kanade.tachiyomi.extension.ar.dilar,
        eu.kanade.tachiyomi.extension.ar.mangadar,
        eu.kanade.tachiyomi.extension.ar.hijala,
        eu.kanade.tachiyomi.extension.ar.mangastarz,
        eu.kanade.tachiyomi.extension.ar.hizomanga,
        eu.kanade.tachiyomi.extension.ar.mangatales,
        eu.kanade.tachiyomi.extension.ar.mangatime,
        eu.kanade.tachiyomi.extension.all.mangadex,
        eu.kanade.tachiyomi.extension.ar.arabtoons
      VANTARA_NSFW_SOURCE_PACKAGES: >-
        eu.kanade.tachiyomi.extension.ar.arabtoons
    defaults:
      run:
        working-directory: spike/extension-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # لا `setup-android`: أسقطتُه لأنه فشل فعلًا على هذا الـrunner —
      # يحاول تثبيت حزمة `tools` القديمة وقد حُذفت من مستودع SDK
      # (`Failed to find package 'tools'`). وrunner أوبونتو يحمل الـSDK
      # أصلًا في `/usr/local/lib/android/sdk` وتراخيصه مقبولة، فـAGP يجده
      # من `ANDROID_HOME` بلا أي خطوة.
      - name: Show the SDK the runner already has
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true

      - name: Run source generator policy tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Generate pinned Arabic source snapshot
        run: |
          set -euo pipefail
          python3 tools/generate_arabic_sources.py
          python3 - <<'PY'
          import json
          p = json.load(open('build/arabic-source-snapshot.json', encoding='utf-8'))
          print('index:', p['indexCommit'])
          print('counts:', p['counts'])
          print('packages:', len(p['packages']))
          assert len(p['packages']) == 17, p['packages']
          assert p['counts'] == {'SAFE': 15, 'MIXED': 1, 'NSFW': 1, 'BLOCKED': 0}, p['counts']
          by_warning = {}
          for package in p['packages']:
              by_warning.setdefault(package['warning'], set()).add(package['packageName'])
          assert by_warning['MIXED'] == {
              'eu.kanade.tachiyomi.extension.all.mangadex',
          }, by_warning['MIXED']
          assert by_warning['NSFW'] == {
              'eu.kanade.tachiyomi.extension.ar.arabtoons',
          }, by_warning['NSFW']
          assert all(package['arabicSourceIds'] for package in p['packages'])
          PY

      - uses: gradle/actions/setup-gradle@v4

      # لا نشحن gradle-wrapper.jar في المستودع: ملف ثنائي في Git يُراجع
      # بالثقة لا بالقراءة. الـrunner يولّده من نسخة Gradle المثبّتة.
      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1 --no-daemon

      - name: Run spike unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # الفشل هو المعلومة هنا بقدر النجاح: لو لم يُصرَّف، نريد السبب كاملًا
      - name: Report build failure
        if: failure()
        run: |
          echo '::group::Gradle build report'
          find . -name '*.txt' -path '*reports*' -exec sh -c 'echo "── $1"; cat "$1"' _ {} \; || true
          echo '::endgroup::'

      - name: Locate the APK
        id: apk
        run: |
          set -euo pipefail
          path=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$path" || { echo 'no apk produced'; exit 1; }
          echo "path=spike/extension-engine/$path" >> "$GITHUB_OUTPUT"
          ls -la "$path"
          echo "sha256: $(sha256sum "$path" | cut -d' ' -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: vantara-spike-seventeen-arabic-debug
          path: |
            ${{ steps.apk.outputs.path }}
            spike/extension-engine/build/arabic-source-snapshot.json
          if-no-files-found: error
          retention-days: 14
