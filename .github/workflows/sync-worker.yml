name: Deploy sync worker

# Workflow إنتاجي مميّز: لا يستقبل push مباشرة ولا workflow_dispatch.
# GitHub يشغّل workflow_run من النسخة الموجودة على default branch، وبعد نجاح
# VANTARA CI على main فقط. لذلك كود فرع تجريبي لا يستطيع تعديل بوابة النشر ثم
# تشغيلها بنفسه، والـD1 لا تُمس قبل أن تنجح الاختبارات.
on:
  workflow_run:
    workflows: ['VANTARA CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sync-worker-production
  cancel-in-progress: false

env:
  D1_NAME: vantara
  WORKER_DIR: services/sync-worker

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ننشر SHA الذي اختبره CI بالضبط، لا HEAD أحدث وصل إلى main أثناء الانتظار.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VANTARA_SESSION_SECRET: ${{ secrets.VANTARA_SESSION_SECRET }}
          VANTARA_IDENTITY_SECRET: ${{ secrets.VANTARA_IDENTITY_SECRET }}
          VANTARA_DEVICE_PEPPER: ${{ secrets.VANTARA_DEVICE_PEPPER }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"    || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID"   || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$VANTARA_SESSION_SECRET"  || { echo 'Missing VANTARA_SESSION_SECRET'; exit 1; }
          test -n "$VANTARA_IDENTITY_SECRET" || { echo 'Missing VANTARA_IDENTITY_SECRET'; exit 1; }
          test -n "$VANTARA_DEVICE_PEPPER"   || { echo 'Missing VANTARA_DEVICE_PEPPER'; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vantara/domain build
      - run: pnpm --filter @vantara/sync-worker typecheck

      - name: Resolve or create the D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base?name=$D1_NAME" \
                | jq -r --arg n "$D1_NAME" '.result[]? | select(.name == $n) | .uuid' | head -1)
          if [ -z "$id" ]; then
            echo "Creating D1 database $D1_NAME"
            id=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                   -H 'Content-Type: application/json' "$base" \
                   --data "{\"name\":\"$D1_NAME\"}" | jq -r '.result.uuid')
          fi
          test -n "$id" && test "$id" != 'null' || { echo 'Could not resolve D1 id'; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "D1 $D1_NAME -> $id"

      - name: Pin the database id into wrangler.toml
        working-directory: ${{ env.WORKER_DIR }}
        run: |
          set -euo pipefail
          sed -i "s|__D1_DATABASE_ID__|${{ steps.d1.outputs.id }}|" wrangler.toml
          grep -q '__D1_DATABASE_ID__' wrangler.toml && { echo 'placeholder not replaced'; exit 1; }
          grep database_id wrangler.toml

      - name: Verify deployed Worker secrets before migrations
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # أول نشر يحتاج bootstrap متعمّد للأسرار. النشر العادي لا يكتب
          # secrets لأن `wrangler secret put` ينشر نسخة فورًا من تلقاء نفسه.
          npx --yes wrangler@4 secret list --format json > /tmp/worker-secrets.json
          for name in VANTARA_SESSION_SECRET VANTARA_IDENTITY_SECRET VANTARA_DEVICE_PEPPER; do
            jq -e --arg name "$name" '.[] | select(.name == $name)' /tmp/worker-secrets.json >/dev/null \
              || { echo "Remote Worker is missing required secret: $name"; exit 1; }
          done

      - name: Apply D1 migrations
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply "$D1_NAME" --remote

      - name: Deploy
        id: deploy
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Smoke test /health
        id: smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')
          url="https://vantara-sync.$sub.workers.dev"
          echo "Worker at $url"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$url/health" -o /tmp/health.json; then break; fi
            echo "health not ready yet (attempt $attempt)"; sleep 5
          done
          cat /tmp/health.json
          jq -e '.ok == true' /tmp/health.json > /dev/null
          jq -e '.rev >= 0' /tmp/health.json > /dev/null
          curl -fsS "$url/v1/accounts" | jq -e '.content | length == 3' > /dev/null
          echo 'Three accounts present.'
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "VANTARA_SYNC_URL=$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify sync invariants against live D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.d1.outputs.id }}
          VANTARA_DEVICE_PEPPER: ${{ secrets.VANTARA_DEVICE_PEPPER }}
        run: node services/sync-worker/verify.mjs "${{ steps.smoke.outputs.url }}"
