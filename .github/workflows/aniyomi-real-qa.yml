name: VANTARA real Aniyomi multi-source APK compatibility (no publish)
on:
  push:
    branches: [fix/engine-core-predebug-20261031, codex/vantara-video-repo-debug-20261101, codex/android-video-hardening-20261101]
    paths:
      - '.github/workflows/aniyomi-real-qa.yml'
      - 'android/app/src/main/kotlin/com/vantara/plugins/UserExtensions.kt'
      - 'android/app/src/main/kotlin/com/vantara/anime/loader/**'
      - 'android/app/src/androidTest/java/com/vantara/anime/**'
      - 'android/app/src/main/kotlin/com/vantara/anime/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-signed-aniyomi-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ORG_GRADLE_PROJECT_vantaraRuntimeDebug: 'true'
      VANTARA_RUNTIME_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Build actual Debug and Android instrumentation APKs
        run: |
          npx cap sync android
          bash android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM for actual Android emulator
        run: sudo chmod 666 /dev/kvm
      - name: Provide a real virtual audio clock for playback validation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          vantara_audio="$RUNNER_TEMP/vantara-ci-audio"
          mkdir -p "$vantara_audio"
          chmod 700 "$vantara_audio"
          pulseaudio -n --daemonize=yes --use-pid-file=no --exit-idle-time=-1 \
            --log-target="file:$GITHUB_WORKSPACE/runtime-pulse-log.txt" \
            --load="module-native-protocol-unix socket=$vantara_audio/native" \
            --load="module-null-sink sink_name=vantara_ci rate=48000 channels=2"
          export PULSE_SERVER="unix:$vantara_audio/native"
          pactl set-default-sink vantara_ci
          pactl set-default-source vantara_ci.monitor
          pactl info > runtime-pulse-info.txt
          pactl list short sinks >> runtime-pulse-info.txt
          printf 'PULSE_SERVER=%s\nQEMU_AUDIO_DRV=pa\n' "$PULSE_SERVER" >> "$GITHUB_ENV"
      - name: Verify all nine actual sources from signed Yuzono APK through AnimeEngine
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: |
            adb logcat -G 16M || true
            adb logcat -c || true
            test_status=0
            bash android/gradlew -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.vantara.anime.AniyomiRealExtensionDeviceTest,com.vantara.anime.AniyomiVideoJourneyDeviceTest -Pandroid.testInstrumentationRunnerArguments.vantaraEphemeralVideo=true -Pandroid.testInstrumentationRunnerArguments.vantaraAniyomiReal=true -Pandroid.testInstrumentationRunnerArguments.vantaraAniyomiRepository=https://raw.githubusercontent.com/yuzono/anime-repo/repo --no-daemon --stacktrace || test_status=$?
            adb logcat -d -v raw -s VANTARA_ANIYOMI_REAL:I > aniyomi-sweep.log
            test "$test_status" -eq 0
            grep -q 'PASS package=' aniyomi-sweep.log
      - name: Upload source-by-source emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aniyomi-9-real-sources-not-release
          path: |
            aniyomi-sweep.log
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
