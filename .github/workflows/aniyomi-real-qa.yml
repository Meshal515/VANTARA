name: VANTARA real Aniyomi multi-source APK compatibility (no publish)
on:
  push:
    branches: [fix/engine-core-predebug-20261031]
    paths: ['.github/workflows/aniyomi-real-qa.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-signed-aniyomi-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ORG_GRADLE_PROJECT_vantaraRuntimeDebug: 'true'
      VANTARA_RUNTIME_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Build actual Debug and Android instrumentation APKs
        run: |
          npx cap sync android
          bash android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM for actual Android emulator
        run: sudo chmod 666 /dev/kvm
      - name: Verify all nine actual sources from signed Yuzono APK through AnimeEngine
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -camera-back none
          script: |
            adb logcat -G 16M || true
            adb logcat -c || true
            bash android/gradlew -p android :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.vantara.anime.AniyomiRealExtensionDeviceTest \
              -Pandroid.testInstrumentationRunnerArguments.vantaraAniyomiReal=true \
              -Pandroid.testInstrumentationRunnerArguments.vantaraAniyomiRepository=https://raw.githubusercontent.com/yuzono/anime-repo/repo \
              --no-daemon --stacktrace
            adb logcat -d -v raw -s VANTARA_ANIYOMI_REAL:I > aniyomi-sweep.log
            grep -q 'PASS package=' aniyomi-sweep.log
      - name: Upload source-by-source emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aniyomi-9-real-sources-not-release
          path: |
            aniyomi-sweep.log
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
