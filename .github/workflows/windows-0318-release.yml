name: Publish verified VANTARA Windows 0.3.18
on:
  push:
    branches: ['fix/windows-subsense-selection-20261020']
    paths: ['.github/workflows/windows-0318-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-verified-torrent-0318
  cancel-in-progress: false
env:
  VERSION: '0.3.18'
  TAG: 'windows-v0.3.18'
jobs:
  checks:
    name: Safety, torrent, rooms, and player tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repository safety and PWA shell digest
        run: pnpm test:safety
      - name: Windows desktop torrent and cache integration
        run: node --test --test-concurrency=1 --test-timeout=60000 apps/desktop/*.test.cjs apps/desktop/src/*.test.mjs tools/windows-icon-resources.test.mjs
      - name: Build shared domain used by account transport tests
        run: pnpm --filter @vantara/domain build
      - name: Subtitle encoding, profile, renderer, video timing, and invitation regression tests
        run: pnpm exec vitest run apps/web/manual-updates.test.js apps/web/pwa/update.test.js apps/web/addons/transport.test.js apps/web/v35/profile*.test.js apps/web/lib/sync*.test.js apps/web/screens/add-account.test.js apps/web/desktop apps/web/pwa/player apps/web/lib/together apps/web/v35/together*.test.js apps/web/v35/reader*.test.js
  video-host:
    name: Compile native Windows video host
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify video host
        shell: pwsh
        run: |
          ./tools/build-video-host.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows video-host compilation failed' }
          node --test apps/desktop/video-host.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows video-host unit tests failed' }
          node --test apps/desktop/src/torrent-window.win.test.mjs apps/desktop/src/torrent-window.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows NTFS sliding-window cache tests failed' }
      - name: Embed original VANTARA artwork in pinned Electron executable
        shell: pwsh
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'electron.zip'
          Invoke-WebRequest 'https://github.com/electron/electron/releases/download/v44.7.2/electron-v44.7.2-win32-x64.zip' -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '10a89447ef64ac5cb9f782af48ffd83734a40ae91681259d1048ca3c9e6c5da4'){throw 'Electron checksum mismatch'}
          $electron=Join-Path $env:RUNNER_TEMP 'electron'
          Expand-Archive $zip $electron
          ./tools/brand-windows-executable.ps1 -InputExe (Join-Path $electron 'electron.exe') -OutputExe 'apps/desktop/native/VANTARA.exe'
          node tools/windows-icon-resources.mjs apps/desktop/native/VANTARA.exe apps/desktop/assets/vantara.ico
          if($LASTEXITCODE -ne 0){throw 'Executable artwork verification failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-current-video-host
          path: |
            apps/desktop/native/vantara-video-host.exe
            apps/desktop/native/VANTARA.exe
          if-no-files-found: error
  package:
    name: Create unsigned Windows installer and portable ZIP
    needs: [checks,video-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-current-video-host
          path: ${{ runner.temp }}/video-host
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install NSIS and 7-Zip
        run: sudo apt-get update && sudo apt-get install -y nsis 7zip
      - name: Build versioned installer and ZIP with pinned checksums
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const version=JSON.parse(fs.readFileSync("apps/desktop/package.json","utf8")).version; assert.equal(version,process.env.VERSION,"رقم التطبيق لا يطابق رقم النشر"); assert.equal(process.env.TAG,`windows-v${version}`,"وسم الإصدار لا يطابق رقم التطبيق");'
          node tools/build-windows.mjs --video-host="$RUNNER_TEMP/video-host/vantara-video-host.exe" --branded-exe="$RUNNER_TEMP/video-host/VANTARA.exe" --output="$RUNNER_TEMP/windows-current"
          cd "$RUNNER_TEMP/windows-current"
          sha256sum -c SHA256SUMS.txt
          test -s "VANTARA-$VERSION-Windows-x64-Setup.exe"
          test -s "VANTARA-$VERSION-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-current-release-candidate
          path: |
            ${{ runner.temp }}/windows-current/*-Setup.exe
            ${{ runner.temp }}/windows-current/*-x64.zip
            ${{ runner.temp }}/windows-current/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
  verify:
    name: Install and play actual MPV on Windows
    needs: package
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: windows-current-release-candidate
          path: ${{ runner.temp }}/windows-current
      - name: Verify install, branding, real embedded playback and user-data preservation
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'windows-current'
          try { ./tools/verify-windows-runtime.ps1 -CandidateDir $dir -Version $env:VERSION }
          catch {
            # سبب الفشل وتقارير الفحص كملاحظات يقرؤها الـAPI (السجلات نفسها خارج متناوله)
            Write-Host "::error title=verify::$($_.Exception.Message)"
            Get-ChildItem $dir -Filter *report.json | ForEach-Object {
              $c = (Get-Content $_.FullName -Raw) -replace "`r?`n", ' '
              Write-Host "::notice title=$($_.Name)::$($c.Substring(0, [Math]::Min(3500, $c.Length)))"
            }
            throw
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-current-verify-evidence
          path: |
            ${{ runner.temp }}/windows-current/*report.json
            ${{ runner.temp }}/windows-current/*report.json.png
          if-no-files-found: warn
  publish:
    name: Publish verified Windows 0.3.18
    needs: [checks,video-host,package,verify,torrent-first-frame,native-player-fullscreen]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-current-release-candidate
          path: ${{ runner.temp }}/windows-current
      - name: Release only tested version; do not replace existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/windows-current"
          sha256sum -c SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $TAG already exists. Refusing to overwrite release." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "VANTARA-$VERSION-Windows-x64-Setup.exe" \
            "VANTARA-$VERSION-Windows-x64.zip" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "VANTARA Windows $VERSION — تسريع فهرس MP4 وإصلاح SubSense والتحديث اليدوي" \
            --notes "يتضمن تحسين أولوية فهرس MP4 المتأخر مع الحفاظ على تحقق قطع التورنت، وإصلاح تحميل نتائج SubSense عند الاختيار وإعادة المحاولة وتغيير أكثر من ثماني ترجمات دون تراكم ملفات. يدعم ASS/SSA في القارئ المشترك ويحافظ على تحديث التطبيق اليدوي من الإعدادات. تحقق التشغيل المقاس على سرب اختبار مؤلف، مع استمرار حدود الشبكة والمشاركين والمصدر؛ لا ضمان لكل تورنت عام. نسخة غير موقعة." \
            --prerelease --latest=false
      - name: Publish Windows update channel after verified release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/windows-current"
          python3 - <<'PYMANIFEST'
          import os,json,pathlib,hashlib
          version=os.environ['VERSION'];p=pathlib.Path(f'VANTARA-{version}-Windows-x64-Setup.exe')
          data={'format':1,'product':'VANTARA','platform':'win32-x64','installer':'nsis','version':version,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/{p.name}",'sourceSha':os.environ['GITHUB_SHA'],'notes':['تحسين أولوية فهرس MP4 في التورنت','إصلاح SubSense والاختيار وإعادة المحاولة','التحديث يدوي من الإعدادات']}
          pathlib.Path('desktop-update.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PYMANIFEST
          if ! gh release view windows-channel --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create windows-channel --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'VANTARA Windows update channel' --notes 'قناة بيان تحديث ويندوز، مستقلة عن إصدارات APK.' --prerelease --latest=false
          fi
          gh release upload windows-channel desktop-update.json --clobber --repo "$GITHUB_REPOSITORY"
  torrent-first-frame:
    name: Real rqbit/mpv owned-swarm first frame
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic startup/cache tests
        shell: pwsh
        run: |
          node --test apps/desktop/src/startup-trace.test.mjs apps/desktop/src/torrent-replay-cache.test.mjs apps/desktop/src/torrent-replay-http.test.mjs apps/desktop/src/torrent-window.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Torrent unit tests failed' }
      - name: Fetch hash-pinned rqbit and mpv for actual decoding
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'vantara-torrent-benchmark'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          function Fetch-Pinned([string]$Url,[string]$Name,[string]$Hash) {
            $file=Join-Path $dir $Name
            Invoke-WebRequest $Url -OutFile $file
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLower() -ne $Hash) { throw "Checksum mismatch: $Name" }
            return $file
          }
          $rqbit=Fetch-Pinned 'https://github.com/ikatson/rqbit/releases/download/v9.0.1/rqbit.exe' 'rqbit.exe' '2ed683203beca628e0c45f62f99feeef4242cecc3444c8422dfe5b1b6aa38cea'
          $archive=Fetch-Pinned 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261014/mpv-x86_64-20261014-git-ec38361c56.7z' 'mpv.7z' 'ab6236a2b78a3e9e93a156c1f638d3182ee906006d019c15d1b7b056a7c9a4c5'
          $out=Join-Path $dir 'mpv'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & 7z x -y "-o$out" $archive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'MPV archive failed' }
          $mpv=Get-ChildItem $out -Recurse -File -Filter 'mpv.exe' | Select-Object -First 1
          if (-not $mpv) { throw 'MPV binary missing' }
          # Match the bundled native runtime used by the real Electron/MPV
          # integration smoke. Its Vulkan loader is not guaranteed on CI hosts.
          $electron=Fetch-Pinned 'https://github.com/electron/electron/releases/download/v44.7.2/electron-v44.7.2-win32-x64.zip' 'electron.zip' '10a89447ef64ac5cb9f782af48ffd83734a40ae91681259d1048ca3c9e6c5da4'
          $electronDir=Join-Path $dir 'electron'
          Expand-Archive $electron -DestinationPath $electronDir
          $vulkan=Join-Path $electronDir 'vulkan-1.dll'
          if (-not (Test-Path $vulkan)) { throw 'Pinned Electron Vulkan loader is missing' }
          Copy-Item $vulkan (Join-Path $mpv.DirectoryName 'vulkan-1.dll') -Force
          Write-Output "MPV executable: $($mpv.FullName)"
          Write-Output "MPV sibling DLLs:"
          Get-ChildItem $mpv.DirectoryName -Filter '*.dll' -File | Select-Object -First 50 -ExpandProperty Name | Write-Output
          & $mpv.FullName --version
          $mpvVersionExit=$LASTEXITCODE
          Write-Output "MPV standalone version exit code: $mpvVersionExit (hex: 0x$([Convert]::ToString([int64]$mpvVersionExit -band 0xffffffffL,16)))"
          if ($mpvVersionExit -ne 0) { throw 'MPV executable cannot start even without a video; investigate Windows DLL dependencies before torrent performance' }
          "TORRENT_RQBIT=$rqbit" | Out-File -Append $env:GITHUB_ENV
          "TORRENT_MPV=$($mpv.FullName)" | Out-File -Append $env:GITHUB_ENV
          "TORRENT_PROOF=$dir" | Out-File -Append $env:GITHUB_ENV
      - name: Fetch checksum-verified FFmpeg encoder and screenshot verifier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:TORRENT_PROOF 'ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-20-13-08/ffmpeg-n8.1.3-18-g46d899d7a0-win64-lgpl-shared-8.1.zip' -OutFile $zip
          $expected='453a30a5019676e805a85d4845e3aad31234dfed4ae0ea2b1d4e97254dc44b0a'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'FFmpeg asset changed; update verified digest before testing' }
          $out=Join-Path $env:TORRENT_PROOF 'ffmpeg'
          Expand-Archive $zip -DestinationPath $out
          $binary=Get-ChildItem $out -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $binary) { throw 'FFmpeg binary missing' }
          "TORRENT_FFMPEG=$($binary.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: 'Fast gate: actual 4K HEVC trailing-index playback, warm cache and restart'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node tools/create-torrent-tail-fixture.mjs "$env:TORRENT_FFMPEG" tools/fixtures/vantara-4k-hevc10.mp4 "$env:TORRENT_PROOF/fixtures"
          if ($LASTEXITCODE -ne 0) { throw 'Authored HEVC fixture creation failed' }
          node tools/torrent-startup-benchmark.mjs --service-module apps/desktop/src/services.mjs --rqbit "$env:TORRENT_RQBIT" --mpv "$env:TORRENT_MPV" --ffmpeg "$env:TORRENT_FFMPEG" --output "$env:TORRENT_PROOF/runs" --fixtures-from "$env:TORRENT_PROOF/fixtures" --runs 2 --kinds late-moov --modes cold,warm,restart --piece-length 4194304 --seed-upload-bps 5242880 --torrent-warmup container --stable-seconds 2 --timeout-ms 30000
          if ($LASTEXITCODE -ne 0) { throw 'Real first-frame benchmark failed; inspect report' }
          $measured=Get-Content (Join-Path $env:TORRENT_PROOF 'runs/results.json') -Raw | ConvertFrom-Json
          foreach ($sample in $measured.runs) {
            if ($sample.ok -ne $true -or $sample.firstRenderedMs -gt 10000) { throw 'First rendered HEVC frame did not satisfy the 10 second gate' }
            if ($sample.renderedProof.params.w -ne 3840 -or $sample.renderedProof.params.h -ne 2160) { throw 'Proof is not the authored 4K source' }
          }
      - name: Summarize measured first-frame latency (not a public-swarm claim)
        if: always()
        shell: pwsh
        run: |
          $report=Join-Path $env:TORRENT_PROOF 'runs/results.json'
          if (-not (Test-Path $report)) { 'Benchmark did not produce results.json' | Out-File -Append $env:GITHUB_STEP_SUMMARY; exit 0 }
          $result=Get-Content $report -Raw | ConvertFrom-Json
          '### First-rendered frame in owned loopback swarm' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '| Fixture | Mode | Successful | Failed | Median ms | P95 ms |' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '| --- | --- | ---: | ---: | ---: | ---: |' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          foreach ($item in $result.summaries) {
            "| $($item.fixture) | $($item.mode) | $($item.successful) | $($item.failed) | $($item.medianMs) | $($item.p95Ms) |" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-torrent-first-frame-${{ github.sha }}
          path: ${{ runner.temp }}/vantara-torrent-benchmark/runs/
          if-no-files-found: warn
  native-player-fullscreen:
    name: Actual Electron, MPV child, F11 and Escape
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test window ownership and compile native host
        shell: pwsh
        run: |
          node --test apps/desktop/fullscreen.test.cjs apps/desktop/video-host.test.cjs apps/desktop/player-overlay.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Window regression tests failed' }
          ./tools/build-video-host.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native host compilation failed' }
      - name: Fetch checksum-pinned runtime fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $runtime=Join-Path $env:RUNNER_TEMP 'vantara-player-review'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          function Fetch-Pinned([string]$Url,[string]$Name,[string]$Hash) {
            $file=Join-Path $runtime $Name
            Invoke-WebRequest $Url -OutFile $file
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLower() -ne $Hash) { throw "Checksum mismatch: $Name" }
            return $file
          }
          $electron=Fetch-Pinned 'https://github.com/electron/electron/releases/download/v44.7.2/electron-v44.7.2-win32-x64.zip' 'electron.zip' '10a89447ef64ac5cb9f782af48ffd83734a40ae91681259d1048ca3c9e6c5da4'
          $mpv=Fetch-Pinned 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261014/mpv-x86_64-20261014-git-ec38361c56.7z' 'mpv.7z' 'ab6236a2b78a3e9e93a156c1f638d3182ee906006d019c15d1b7b056a7c9a4c5'
          $rqbit=Fetch-Pinned 'https://github.com/ikatson/rqbit/releases/download/v9.0.1/rqbit.exe' 'rqbit.exe' '2ed683203beca628e0c45f62f99feeef4242cecc3444c8422dfe5b1b6aa38cea'
          Expand-Archive $electron (Join-Path $runtime 'electron')
          & 7z x -y "-o$PWD/apps/desktop/native" $mpv
          if ($LASTEXITCODE -ne 0) { throw 'MPV extraction failed' }
          Copy-Item $rqbit 'apps/desktop/native/rqbit.exe'
          Copy-Item (Join-Path $runtime 'electron/vulkan-1.dll') 'apps/desktop/native/vulkan-1.dll'
          node -e "require('node:fs').cpSync('apps/web','apps/desktop/web',{recursive:true,filter:p=>!p.includes('node_modules')})"
          if ($LASTEXITCODE -ne 0) { throw 'Web fixture staging failed' }
      - name: Prove real MPV binding, Electron fullscreen and matching native bounds
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $runtime=Join-Path $env:RUNNER_TEMP 'vantara-player-review'
          $report=Join-Path $runtime 'embedded-report.json'
          $fixture=(Resolve-Path 'android/app/src/androidTest/assets/addon-torrent-proof.mp4').Path
          $app=(Resolve-Path 'apps/desktop').Path
          $stdout=Join-Path $runtime 'electron.stdout.log'
          $stderr=Join-Path $runtime 'electron.stderr.log'
          $proc=Start-Process (Join-Path $runtime 'electron/electron.exe') -ArgumentList @("`"$app`"","--native-video-smoke-report=`"$report`"","--native-video-smoke-fixture=`"$fixture`"") -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if (-not $proc.WaitForExit(180000)) { $proc.Kill(); throw 'Embedded player proof timed out' }
          if ($proc.ExitCode -ne 0) { Get-Content $stderr; throw "Embedded player proof exited $($proc.ExitCode)" }
          $proof=Get-Content $report -Raw | ConvertFrom-Json
          foreach ($key in @('realMpv','realElectron','realEmbeddedChild','resized','fullscreen','mainF11','overlayF11','mpvMappedF11','overlayEscapeRestores','mpvMappedEscape','rendererControls','arabicSubtitleSelected','overlaySubtitleDelay','cleanup')) {
            if ($proof.$key -ne $true) { throw "Missing runtime proof: $key" }
          }
          if (-not $proof.fullscreenBounds -or -not (Test-Path "$report.fullscreen.png")) { throw 'Missing actual fullscreen bounds or screen capture' }
          @{sourceSha=$env:GITHUB_SHA;ref=$env:GITHUB_REF;publish=$false} | ConvertTo-Json | Set-Content (Join-Path $runtime 'review-source.json')
      - name: Read proof diagnostics
        if: always()
        shell: pwsh
        run: |
          $runtime=Join-Path $env:RUNNER_TEMP 'vantara-player-review'
          Get-ChildItem $runtime -Filter '*report.json' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          Get-ChildItem $runtime -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-player-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vantara-player-review/*report.json*
            ${{ runner.temp }}/vantara-player-review/*.log
            ${{ runner.temp }}/vantara-player-review/review-source.json
            apps/desktop/native/vantara-video-host.exe
          if-no-files-found: warn
