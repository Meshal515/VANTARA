name: Android translation runtime

on:
  push:
    branches: [chatgpt/translation-three-anchor-integration, main]
    paths:
      - 'android/app/src/**/translation/**'
      - 'android/app/src/androidTest/assets/source-*'
      - 'tools/translation-*'
      - '.github/workflows/translation-runtime.yml'

permissions:
  contents: read

concurrency:
  group: translation-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-models:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cap sync android
      - name: Build app and test APK for emulator, preserving product arm64 ABI
        run: |
          cat > "$RUNNER_TEMP/translation-x86.gradle" <<'GRADLE'
          allprojects { afterEvaluate { p -> if (p.plugins.hasPlugin('com.android.application')) { p.android.defaultConfig.ndk.abiFilters.clear(); p.android.defaultConfig.ndk.abiFilters.add('x86_64') } } }
          GRADLE
          cd android
          ./gradlew -I "$RUNNER_TEMP/translation-x86.gradle" :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/translation-models
          key: translation-runtime-models-${{ hashFiles('android/app/src/main/kotlin/com/vantara/plugins/translation/ModelStore.kt') }}
      - run: python3 tools/translation-download-models.py "$RUNNER_TEMP/translation-models"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run original models, actual Android fonts/pixels, save and reopen
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          script: bash tools/translation-runtime-check.sh "$RUNNER_TEMP/translation-models" runtime-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-runtime-${{ github.sha }}
          path: |
            runtime-evidence/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
