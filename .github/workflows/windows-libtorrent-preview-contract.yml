name: Windows libtorrent Preview Selection Contract
on:
  push:
    branches: ['chatgpt/windows-libtorrent-preview-activation-20261026']
    paths:
      - 'apps/desktop/torrent-preview*'
      - 'apps/desktop/main.cjs'
      - '.github/workflows/windows-libtorrent-preview-contract.yml'
  pull_request:
    paths:
      - 'apps/desktop/torrent-preview*'
      - 'apps/desktop/main.cjs'
      - '.github/workflows/windows-libtorrent-preview-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-libtorrent-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selection:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse main-process preview integration
        run: |
          node --check apps/desktop/main.cjs
          node --check apps/desktop/torrent-preview.cjs
      - name: Verify default engine remains rqbit and explicit native bundle is enforced
        run: node --test apps/desktop/torrent-preview.test.cjs apps/desktop/main.test.cjs
