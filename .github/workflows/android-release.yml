name: Android release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'versionName (e.g. 1.0.0). Defaults to 0.<run_number>.0'
        required: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_PAGES_PROJECT: vantara
  WORKER_NAME: vantara-sync

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Capacitor 6 على AGP 8: يحتاج JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify signing secrets exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }

      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            name="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            name="${{ inputs.version }}"
          else
            name="0.${GITHUB_RUN_NUMBER}.0"
          fi
          # versionCode تصاعدي دائمًا: أندرويد يرفض تثبيت تحديث برقم أقل
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "VANTARA $name (code ${GITHUB_RUN_NUMBER})"

      # عنوان الـWorker يُستنتج من حساب Cloudflare بدل سرّ إضافي يُنسى تحديثه
      - name: Resolve endpoint URLs
        id: urls
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL_VAR: ${{ vars.VANTARA_API_URL }}
        run: |
          set -euo pipefail
          sync=''
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | jq -r '.result.subdomain // empty')
            if [ -n "$sub" ]; then sync="https://$WORKER_NAME.$sub.workers.dev"; fi
          fi
          # خادم المحتوى يعرفه أصحابه وحدهم (نفق منزلي). فارغًا يُضبط من
          # الإعدادات داخل التطبيق بلا إصدار جديد.
          echo "sync=$sync" >> "$GITHUB_OUTPUT"
          echo "api=${API_URL_VAR:-}" >> "$GITHUB_OUTPUT"
          echo "updates=https://$CF_PAGES_PROJECT.pages.dev" >> "$GITHUB_OUTPUT"
          echo "sync=$sync"
          echo "updates=https://$CF_PAGES_PROJECT.pages.dev"

      - name: Bake endpoints into the web bundle
        env:
          SYNC_URL: ${{ steps.urls.outputs.sync }}
          API_URL: ${{ steps.urls.outputs.api }}
          UPDATES_URL: ${{ steps.urls.outputs.updates }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          file=apps/web/lib/config.js
          # العلامات النصية تُستبدل هنا فقط، فلا سرّ ولا عنوان في المستودع
          python3 - "$file" <<'PY'
          import os, sys
          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          for token, value in (
              ('__VANTARA_SYNC_URL__', os.environ['SYNC_URL']),
              ('__VANTARA_API_URL__', os.environ['API_URL']),
              ('__VANTARA_UPDATES_URL__', os.environ['UPDATES_URL']),
              ('__VANTARA_VERSION__', os.environ['VERSION_NAME']),
          ):
              text = text.replace(token, value)
          open(path, 'w', encoding='utf-8').write(text)
          PY
          grep -n "sync:\|api:\|updates:\|BAKED_VERSION" "$file"

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vantara.jks"
          test -s "$RUNNER_TEMP/vantara.jks" || { echo 'Decoded keystore is empty'; exit 1; }

      - name: Assemble signed release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/vantara.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: vantara
          VANTARA_VERSION_NAME: ${{ steps.version.outputs.name }}
          VANTARA_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      # البناء الناجح لا يعني APK موقّعًا: بلا keystore ينتج Gradle ملفًا
      # غير موقّع بهدوء، ويُرفض عند التثبيت على الهاتف
      - name: Verify the APK is actually signed
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk" || { echo 'No APK produced'; exit 1; }
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"

          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/verify.txt
          grep -q 'Verifies' /tmp/verify.txt || { echo 'APK signature did not verify'; exit 1; }
          # v2 هو ما يفرضه أندرويد 7+؛ v1 وحده يُرفض على الأجهزة الحديثة
          grep -q 'JAR signing\|v1 scheme' /tmp/verify.txt || true
          grep -qE 'v2 scheme \(APK Signature Scheme v2\): true' /tmp/verify.txt \
            || { echo 'v2 signature missing'; exit 1; }

          mkdir -p dist
          cp "$apk" dist/VANTARA-release.apk
          sha256sum dist/VANTARA-release.apk | tee dist/VANTARA-release.apk.sha256

      # يُنشر مع الواجهة على Pages؛ التطبيق يقرأه ليعرف أن هناك أحدث
      - name: Write version.json
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/VANTARA-release.apk"
          cat > dist/version.json <<JSON
          {
            "version": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "url": "${url}",
            "notes": ""
          }
          JSON
          cat dist/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: VANTARA-release-apk
          path: |
            dist/VANTARA-release.apk
            dist/VANTARA-release.apk.sha256
            dist/version.json
          if-no-files-found: error
          retention-days: 90

      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "VANTARA ${{ steps.version.outputs.name }}" \
            --notes "APK موقّع. التثبيت: افتح الملف على الجوال واسمح بالتثبيت من هذا المصدر." \
            --verify-tag || echo 'release already exists, uploading assets'
          gh release upload "$GITHUB_REF_NAME" \
            dist/VANTARA-release.apk \
            dist/VANTARA-release.apk.sha256 \
            --clobber

      - name: Summary
        run: |
          {
            echo "### VANTARA ${{ steps.version.outputs.name }}"
            echo
            echo "- versionCode: ${{ steps.version.outputs.code }}"
            echo "- sync: ${{ steps.urls.outputs.sync }}"
            echo "- updates: ${{ steps.urls.outputs.updates }}"
            echo "- sha256: \`$(cut -d' ' -f1 dist/VANTARA-release.apk.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
