name: Debug journeys (upgrade, clean, repository → full chapter)
# ثلاث حالات منفصلة على محاكي حقيقي بطلب المالك (31 أكتوبر 2026):
#  1. upgrade: Debug الحالي (بنسخ مدمجة) ← install -r بالنسخة المفصولة، بلا حذف ولا مسح، ولا يضيع شيء
#  2. clean: تثبيت نظيف بلا أي مصدر ولا تنزيل ذاتي
#  3. repo-read: من النظيف، إضافة مستودع ← تثبيت مصدر ← قراءة فصل كامل، ومصدر كان مدمجًا من الشبكة
# النسختان تُبنيان على runner واحد بمفتاح debug نفسه (لا أسرار توقيع هنا)؛ توافق التوقيع الحقيقي تثبته
# بوابة android-debug.yml عند كل نشر.
on:
  push:
    branches: [claude/supernatural-addons]
    paths:
      - tools/android-debug/journeys.*
      - .github/workflows/debug-journeys.yml
  workflow_dispatch:
    inputs:
      previous_ref:
        description: Debug الحالي الذي يُرقّى فوقه
        default: feat/addons-v7-native-manager-20261027
permissions:
  contents: read
concurrency:
  group: debug-journeys-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ORG_GRADLE_PROJECT_vantaraRuntimeDebug: 'true'
      VANTARA_RUNTIME_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
        with: { path: candidate }
      - uses: actions/checkout@v4
        with: { path: previous, ref: "${{ inputs.previous_ref || 'feat/addons-v7-native-manager-20261027' }}" }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: candidate/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build previous and candidate Debug with the same runner key
        run: |
          set -euo pipefail
          build() { # dir versionCode
            cd "$GITHUB_WORKSPACE/$1"
            pnpm install --frozen-lockfile
            V="0.0.$2" python3 -c "import os;from pathlib import Path;p=Path('apps/web/lib/config.js');p.write_text(p.read_text().replace('__VANTARA_VERSION__',os.environ['V']))"
            npx cap sync android
            cd android && chmod +x gradlew
            VANTARA_VERSION_NAME="0.0.$2" VANTARA_VERSION_CODE="$2" ./gradlew --no-daemon -q :app:assembleDebug
            cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/$1.apk"
          }
          build previous 9000
          build candidate 9001
          ls -la "$GITHUB_WORKSPACE"/*.apk
          for a in previous candidate; do echo "$a bundles $(unzip -l "$GITHUB_WORKSPACE/$a.apk" | grep -c 'assets/extensions/.*\.apk' || true) source APKs"; done
      - uses: actions/upload-artifact@v4
        with:
          name: journey-apks
          path: |
            previous.apk
            candidate.apk

  journey:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case: [upgrade, clean]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: journey-apks, path: apks }
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Journey on Android (${{ matrix.case }})
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: if [ "${{ matrix.case }}" = upgrade ]; then bash tools/android-debug/journeys.sh upgrade apks/previous.apk apks/candidate.apk; else bash tools/android-debug/journeys.sh clean apks/candidate.apk; fi
      - name: Summarize
        if: always()
        run: |
          for f in android-debug-evidence/*/*.json; do
            [ -f "$f" ] || continue
            node -e "const p=require('./'+process.argv[1]);console.log((p.passed?'PASS':'FAIL')+' '+p.phase);for(const [k,v] of Object.entries(p.steps||{}))console.log('  '+v.result+' '+k+' '+JSON.stringify(v.value??v.error).slice(0,400))" "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-${{ matrix.case }}
          path: android-debug-evidence/
