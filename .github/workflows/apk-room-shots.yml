name: APK together room screenshots
# طلب المالك (15 نوفمبر): صور من التطبيق نفسه لا تصاميم. يلتقط غرفة «مشاهدة معًا» الحقيقية في مشغّل الـAPK على محاكي
# بمقاس هاتف أفقي: قبل اختيار السيرفر، ورقة السيرفرات وفلترها، الحلقات، التجهيز والجاهزية. لا ينشر شيئًا.
on:
  push:
    branches: ['ccr-81586a69-ez4f3g']
    paths:
      - '.github/workflows/apk-room-shots.yml'
      - 'android/app/src/androidTest/java/com/vantara/anime/player/TogetherRoomScreensDeviceTest.kt'
      - 'android/app/src/main/kotlin/com/vantara/anime/player/together/**'
      - 'android/app/src/main/kotlin/com/vantara/anime/player/PlayerActivity.kt'
      - 'android/app/src/main/kotlin/com/vantara/anime/player/SeekPreview.kt'
      - 'android/app/src/androidTest/java/com/vantara/anime/player/SeekPreviewScreensDeviceTest.kt'
      - 'android/app/src/androidTest/java/com/vantara/anime/player/GlassPlayerScreensDeviceTest.kt'
      - 'android/app/src/main/kotlin/com/vantara/anime/player/Ui.kt'
  workflow_dispatch:
    inputs:
      classes:
        description: 'فئات الاختبار (لقطات Glass وحدها: com.vantara.anime.player.GlassPlayerScreensDeviceTest)'
        required: false
        default: 'com.vantara.anime.player.TogetherRoomScreensDeviceTest,com.vantara.anime.player.SeekPreviewScreensDeviceTest'
      glass:
        description: '1 = الغرفة بالتأثير الزجاجي'
        required: false
        default: '0'
permissions:
  contents: read
concurrency:
  group: apk-room-shots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cap sync android
      - name: Build emulator APKs
        run: |
          cat > "$RUNNER_TEMP/x86.gradle" <<'GRADLE'
          allprojects { afterEvaluate { p -> if (p.plugins.hasPlugin('com.android.application')) { p.android.defaultConfig.ndk.abiFilters.clear(); p.android.defaultConfig.ndk.abiFilters.add('x86_64') } } }
          GRADLE
          cd android
          ./gradlew -I "$RUNNER_TEMP/x86.gradle" :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Capture the real together room
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p player-shots
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e roomShots 1 -e glass ${{ inputs.glass || '0' }} -e class ${{ inputs.classes || 'com.vantara.anime.player.TogetherRoomScreensDeviceTest,com.vantara.anime.player.SeekPreviewScreensDeviceTest' }} com.vantara.app.debug.test/androidx.test.runner.AndroidJUnitRunner | tee player-shots/instrumentation.txt
            for f in $(adb shell run-as com.vantara.app.debug ls files/player-shots | tr -d '\r'); do adb exec-out run-as com.vantara.app.debug cat "files/player-shots/$f" > "player-shots/$f"; done
            ls -la player-shots
      - name: Shots as notes (readable through the checks API)
        if: always()
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, pathlib
          from PIL import Image
          shots = sorted(p for p in pathlib.Path('player-shots').glob('*.png') if not p.stem.lstrip('g-').startswith('leave-'))
          if not shots:
              print('::error title=shots::لا لقطات'); raise SystemExit(0)
          for p in shots[:10]:
              im = Image.open(p).convert('RGB')
              if im.width < im.height: im = im.rotate(90, expand=True)
              im.thumbnail((960, 960))
              buf = io.BytesIO(); im.save(buf, 'JPEG', quality=55, optimize=True)
              print(f"::notice title=shot {p.stem}::{base64.b64encode(buf.getvalue()).decode()}")
          PY
      - name: Leave-room shots as notes (GitHub keeps 10 notices per step)
        if: always()
        run: |
          python3 - <<'PY'
          import base64, io, pathlib
          from PIL import Image
          for p in sorted(pathlib.Path('player-shots').glob('leave-*.png'))[:10]:
              im = Image.open(p).convert('RGB')
              if im.width < im.height: im = im.rotate(90, expand=True)
              im.thumbnail((960, 960))
              buf = io.BytesIO(); im.save(buf, 'JPEG', quality=55, optimize=True)
              print(f"::notice title=shot {p.stem}::{base64.b64encode(buf.getvalue()).decode()}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-room-shots
          path: player-shots/
          if-no-files-found: warn
