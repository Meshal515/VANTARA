name: Audit on Android emulator (Debug APK, read-only)
# تدقيق Issue #323 على APK Debug حقيقي في محاكي: نفس WebView التطبيق وجسوره الأصلية عبر CDP.
# لا نشر ولا رفع لأي قناة ولا أسرار: يبني Debug من فرع V7 ويشغّل docs/audit/ux-2026-11-12/android/.
on:
  push:
    branches: [claude/modest-bardeen-a7nay1]
    paths:
      - docs/audit/ux-2026-11-12/android/**
      - .github/workflows/audit-emulator.yml
  workflow_dispatch:
    inputs:
      app_ref:
        description: فرع/commit الذي يُبنى منه APK Debug
        default: feat/addons-v7-native-manager-20261027
permissions:
  contents: read
concurrency:
  group: audit-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_vantaraRuntimeDebug: 'true'
      VANTARA_RUNTIME_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ inputs.app_ref || 'feat/addons-v7-native-manager-20261027' }}
      - uses: pnpm/action-setup@v4
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        working-directory: app
        run: |
          set -euo pipefail
          git log -1 --format='%H %s' | tee "$GITHUB_STEP_SUMMARY"
          pnpm install --frozen-lockfile
          V="0.0.9100" python3 -c "import os;from pathlib import Path;p=Path('apps/web/lib/config.js');p.write_text(p.read_text().replace('__VANTARA_VERSION__',os.environ['V']))"
          npx cap sync android
          cd android && chmod +x gradlew
          VANTARA_VERSION_NAME="0.0.9100" VANTARA_VERSION_CODE="9100" ./gradlew --no-daemon -q :app:assembleDebug
          cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/audit.apk"
      - uses: actions/upload-artifact@v4
        with: { name: audit-apk, path: audit.apk }

  audit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [addons, sheets]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: audit-apk, path: apks }
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Audit journeys on Android
        timeout-minutes: 40
        env:
          AUDIT_PART: ${{ matrix.part }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash docs/audit/ux-2026-11-12/android/audit.sh apks/audit.apk
      - name: Summarize
        if: always()
        run: |
          f=audit-evidence/audit.json
          [ -f "$f" ] || { echo 'no audit.json'; exit 0; }
          node -e "const p=require('./'+process.argv[1]);for(const [k,v] of Object.entries(p.steps))console.log(v.result+' '+k+' ('+v.ms+'ms) '+JSON.stringify(v.value??v.error).slice(0,1500))" "$f" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence-${{ matrix.part }}
          path: audit-evidence/
