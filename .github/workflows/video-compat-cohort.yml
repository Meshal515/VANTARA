name: VANTARA native video compatibility cohort (manual, no publish)

on:
  push:
    branches: [codex/android-video-hardening-20261101]
    paths: ['.github/workflows/video-compat-cohort.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantara-video-cohort-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-cloudstream-repository-report:
    name: ${{ matrix.cohort }} (actual native video)
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: mehdi-anime
            ecosystem: cloudstream
            content: anime
            repository: https://raw.githubusercontent.com/mehdigm4life/mehdigm-stream/main/Mehdi.json
            providers: انمي فور اب (Anime4Up),انمي زد (Animezid),أنمي داي (AnimeDay),أنمي سلاير (AnimeSlayer),ويت أنمي (WitAnime),أنمي عرب (Anime3rb),أنمي رِفت (AnimeRift)
          - cohort: csar-anime
            ecosystem: cloudstream
            content: anime
            repository: https://raw.githubusercontent.com/mo7AmMeD64/cs-ar/main/repo/repo.json
            providers: AnimeWitcher,Anime3rb,Anime Phoenix,أنمي سلاير,أنمي داي,أنمي رِفت (AnimeRift),ويت أنمي (WitAnime)
          - cohort: mehdi-cinema
            ecosystem: cloudstream
            content: cinema
            repository: https://raw.githubusercontent.com/mehdigm4life/mehdigm-stream/main/Mehdi.json
            providers: فاصل إعلاني (FaselHD),شاهد فور يو (Shahid4u),توك توك سينما (TukTuk),سيما كلاود (CimaCloud),إيجي ديد (EgyDead),إيجي واتش (Egywatch),سيما وبس (Cimawbas),سيما ناو (CimaNow)
          - cohort: anime-extra
            ecosystem: cloudstream
            content: anime
            providers: Anime3rb,Anime-Phoenix,Animerco,Brstej,Dima toon,Elif,TuniflexBlog
          - cohort: cinema-a
            ecosystem: cloudstream
            content: cinema
            providers: 3isk,5TV,Aflaam,Asia2tv 2,Alooytv,CimaClub,Cimatn,EgyWatch
          - cohort: cinema-b
            ecosystem: cloudstream
            content: cinema
            providers: Eshek,Krmzy,LodyNet,Shahid4u,Shahidwbas,TopCinema,Tuktukcima,WeCima
          - cohort: aniyomi-ar
            ecosystem: aniyomi
            content: anime
            providers: animeblkom,animeiat,animelek,animerco,arabanime,arabseed,asia2tv,cimaleek,egydead,faselhd,tuktukcinema
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ORG_GRADLE_PROJECT_vantaraRuntimeDebug: 'true'
      VANTARA_RUNTIME_DEBUG: 'true'
      VANTARA_NATIVE_VIDEO: 'true'
      VANTARA_LIVE_REPO: ${{ matrix.repository }}
      VANTARA_LIVE_ONLY: ${{ matrix.providers }}
      VANTARA_LIVE_REQUIRED: ${{ matrix.providers }}
      VANTARA_LIVE_HEALTHY: ''
      VANTARA_LIVE_LIMIT: '8'
      VANTARA_LIVE_CONTENT: ${{ matrix.content }}
      VANTARA_ANIYOMI_PACKAGES: ${{ matrix.providers }}
      VANTARA_VIDEO_ECOSYSTEM: ${{ matrix.ecosystem }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Prove the live media report rejects false-green/empty source journeys
        run: node --test tools/repository-compat/summarize_live_sweep.test.mjs tools/repository-compat/live-video-args.test.mjs
      - name: Copy current web shell and compile actual runtime-enabled Debug APK
        run: |
          set -euo pipefail
          npx cap sync android
          bash android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Emulator can run an isolated CloudStream provider
        run: sudo chmod 666 /dev/kvm
      - name: Provide a real virtual audio clock for playback validation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          vantara_audio="$RUNNER_TEMP/vantara-ci-audio"
          mkdir -p "$vantara_audio"
          chmod 700 "$vantara_audio"
          pulseaudio -n --daemonize=yes --use-pid-file=no --exit-idle-time=-1 \
            --log-target="file:$GITHUB_WORKSPACE/runtime-pulse-log.txt" \
            --load="module-native-protocol-unix socket=$vantara_audio/native" \
            --load="module-null-sink sink_name=vantara_ci rate=48000 channels=2"
          export PULSE_SERVER="unix:$vantara_audio/native"
          pactl set-default-sink vantara_ci
          pactl set-default-source vantara_ci.monitor
          pactl info > runtime-pulse-info.txt
          pactl list short sinks >> runtime-pulse-info.txt
          printf 'PULSE_SERVER=%s\nQEMU_AUDIO_DRV=pa\n' "$PULSE_SERVER" >> "$GITHUB_ENV"
      - name: Record real CloudStream sources without modifying production profiles
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash tools/repository-compat/run_video_cohort.sh
      - name: Upload actual per-plugin journey proof, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-cohort-${{ matrix.cohort }}-evidence
          path: |
            aniyomi-install-instrumentation.txt
            aniyomi-restart-instrumentation.txt
            aniyomi-sweep.log
            live-video-sweep.jsonl
            live-video-sweep-logcat.txt
            live-video-summary.md
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
