name: VANTARA cinema CloudStream published plugins live QA (Debug only, no publish)

on:
  push:
    branches: [codex/vantara-video-repo-debug-20261101]
    paths:
      - '.github/workflows/video-cinema-live-qa.yml'
      - 'tools/repository-compat/run_live_video.sh'
      - 'tools/repository-compat/summarize_live_sweep.mjs'
      - 'extensions/runtime-android/integration/src/androidTest/kotlin/com/vantara/runtime/LiveRepositorySweepTest.kt'
      - 'extensions/runtime-android/integration/src/main/**'
      - 'extensions/runtime-android/cloudstream/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantara-cinema-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cinema-providers-live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ORG_GRADLE_PROJECT_vantaraRuntimeDebug: 'true'
      VANTARA_RUNTIME_DEBUG: 'true'
      VANTARA_LIVE_ONLY: 'Faselhd,Egydead,Akwam,Mycima,Cimalight'
      VANTARA_LIVE_REQUIRED: 'Faselhd,Egydead,Akwam,Mycima,Cimalight'
      VANTARA_LIVE_LIMIT: '5'
      VANTARA_LIVE_HEALTHY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Validate robust source evidence and shell before device test
        run: |
          node --test tools/repository-compat/summarize_live_sweep.test.mjs
          bash -n tools/repository-compat/run_live_video.sh
      - name: Build actual runtime-enabled app and tests
        run: |
          set -euo pipefail
          npx cap sync android
          bash android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - run: sudo chmod 666 /dev/kvm
      - name: Install and test five independently published cinema providers
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -camera-back none
          script: bash tools/repository-compat/run_live_video.sh
      - name: Retain per-plugin successes and failures, never publish APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-cinema-sources-live-proof-not-decoded-frames
          path: |
            live-video-sweep.jsonl
            live-video-sweep-logcat.txt
            live-video-summary.md
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: warn
