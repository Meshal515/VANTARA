name: Windows torrent A/B on strong legal swarms
# بحث السبب الجذري لبطء libtorrent على ويندوز (قرار المالك: libtorrent يبقى الأساسي وrqbit احتياطيًا؛ لا تغيير
# للافتراضي بلا اختبارات متكررة تثبته). يبني vantara-torrent.exe من الفرع (فيه /diag وتجارب الإعداد بمتغيرات بيئة
# فقط)، ويأخذ rqbit.exe من البناء المنشور، ثم يقيس على أسراب قوية قانونية (أحدث Ubuntu Desktop وDebian netinst):
#   - libtorrent بإعدادات الـAPK كما هي، وrqbit، وتجارب «إعداد واحد لكل مرة» (lt:الاسم).
#   - لكل تشغيل خط زمني كل ثانية: ما وصل للقارئ فعلًا، وسرعة تنزيل المحرك، والمشاركون، ومن يسمح لنا بالتنزيل،
#     والقطعة المنتظرة وكتلها ومن يرسلها.
# لا ينشر شيئًا ولا يلمس القناة.
on:
  push:
    branches: ['ccr-81586a69-ez4f3g']
    paths:
      - 'tools/torrent-host/swarm-ab.mjs'
      - 'tools/torrent-host/torrent-file.mjs'
      - 'tools/torrent-host/vantara-torrent.cpp'
      - '.github/workflows/windows-torrent-ab.yml'
  workflow_dispatch:
    inputs:
      sources:
        description: 'ubuntu | strong | cc-by | all'
        type: string
        default: 'ubuntu'
      quick:
        description: 'Quick screening: first 4MB only, 45 s budget'
        type: boolean
        default: true
      rounds:
        description: 'Alternating rounds'
        type: string
        default: '3'
permissions:
  contents: read
concurrency:
  group: windows-torrent-ab
  cancel-in-progress: false
jobs:
  ab:
    name: ${{ matrix.group }} — libtorrent (APK settings) vs one-setting variants, per-second diagnostics (Windows)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # التسليم: قياس #6 أظهر read_piece ينتظر 6–7 ث مع mmap وpread معًا (وposix جمّد المحرك)، فالبطء في طابور
          # القرص كله. التجربة: القطعة من ملفها مباشرة بعد have_piece مع مطابقة SHA-1، ضد الأساسي كما هو.
          - group: direct-read
            variants: |-
              direct|||VANTARA_LT_DIRECT=1
            rqbit: 'no'
    timeout-minutes: 170
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests for the torrent-file parser
        run: node --test tools/torrent-host/torrent-file.test.mjs
      # المكتبة المبنية نفسها (لا ملفات vcpkg الثنائية فقط): بناؤها من الصفر ~20 دقيقة، ومن الكاش ~دقيقة. يُحفظ
      # فور البناء (cache/save) حتى لو سقط القياس بعده، فلا يعاد البناء في التجربة التالية.
      - name: Restore built libtorrent (vcpkg installed tree)
        id: ltcache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-libtorrent-x64-windows-static-v1
      - name: Build vantara-torrent.exe from this branch (with /diag)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          if (-not (Test-Path 'C:\vcpkg\installed\x64-windows-static\share\libtorrent')) {
            & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libtorrent:x64-windows-static
            if ($LASTEXITCODE -ne 0) { throw 'vcpkg libtorrent build failed' }
          } else { Write-Host 'libtorrent restored from cache' }
          cmake -S tools/torrent-host -B build/torrent-host -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build build/torrent-host --config Release
          if ($LASTEXITCODE -ne 0) { throw 'engine build failed' }
          $exe = (Resolve-Path build/torrent-host/Release/vantara-torrent.exe).Path
          & $exe --version
          "NATIVE=$exe" | Out-File -Append $env:GITHUB_ENV
      - name: Save built libtorrent for the next experiment
        if: steps.ltcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-installed-libtorrent-x64-windows-static-v1
      - name: Engine tests on Windows (bytes, priority order, /diag)
        env:
          VANTARA_TORRENT_HOST_BINARY: ${{ env.NATIVE }}
        run: node --test --test-concurrency=1 --test-timeout=120000 tools/torrent-host/host.test.mjs
      - name: rqbit.exe from the published Windows Debug build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download windows-debug-channel --repo $env:GITHUB_REPOSITORY --pattern desktop-debug.json --dir manifest
          $build = (Get-Content manifest/desktop-debug.json -Raw | ConvertFrom-Json).build
          gh release download "windows-debug-$build" --repo $env:GITHUB_REPOSITORY --pattern "VANTARA-Debug-0.4.$build-Windows-x64.zip" --dir dl
          Expand-Archive (Get-ChildItem dl -Filter '*.zip' | Select-Object -First 1).FullName portable
          $rq = Get-ChildItem portable -Recurse -Filter 'rqbit.exe' | Select-Object -First 1
          "RQBIT=$($rq.FullName)" | Out-File -Append $env:GITHUB_ENV
      - name: A/B with per-second diagnostics (${{ matrix.group }})
        shell: pwsh
        env:
          SOURCES: ${{ inputs.sources || 'ubuntu' }}
          ROUNDS: ${{ inputs.rounds || '3' }}
          QUICK: ${{ inputs.quick }}
          # pread غير موجود في كل نسخ libtorrent: /diag يكشف المحرك الفعلي لكل تشغيل
          WITH_RQBIT: ${{ matrix.rqbit }}
          VARIANTS: ${{ matrix.variants }}
        run: |
          # مصفوفة وسائط صريحة: لا Invoke-Expression ولا علامات تنصيص متداخلة (سقط التشغيل #3 بخطأ تحليل)
          $argv = @('tools/torrent-host/swarm-ab.mjs', "--libtorrent=$env:NATIVE", "--report=$(Join-Path $env:RUNNER_TEMP 'swarm-ab.json')", "--rounds=$env:ROUNDS", "--sources=$env:SOURCES")
          if ($env:QUICK -ne 'false') { $argv += '--quick' }
          if ($env:WITH_RQBIT -eq 'yes') { $argv += "--rqbit=$env:RQBIT" }
          foreach ($line in ($env:VARIANTS -split "`n")) { $v = $line.Trim(); if ($v) { $argv += "--lt-variant=$v" } }
          Write-Host ("node " + ($argv -join ' '))
          & node @argv
          if ($LASTEXITCODE -ne 0) { throw "swarm-ab exited $LASTEXITCODE" }
          $r = Get-Content (Join-Path $env:RUNNER_TEMP 'swarm-ab.json') -Raw | ConvertFrom-Json
          '### ${{ matrix.group }}: libtorrent (APK settings) vs one-setting variants' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```json' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          ($r.summary | ConvertTo-Json -Depth 5) | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-torrent-ab-${{ matrix.group }}
          path: ${{ runner.temp }}/swarm-ab.json
          if-no-files-found: warn
