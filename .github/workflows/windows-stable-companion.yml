name: VANTARA unified Windows stable releases
on:
  workflow_run:
    workflows: ['Android stable APK']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stable_tag:
        description: 'Published stable tag to recover (stable-N)'
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-stable-${{ github.event.release.tag_name || inputs.stable_tag || github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve only a published stable release from this repository
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.stable_tag }}
        run: |
          set -euo pipefail
          tag=$(python3 - <<'PYCODE'
          import json,os,re
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          kind=os.environ['GITHUB_EVENT_NAME']
          tag=('stable-'+str(event['workflow_run']['run_number'])) if kind=='workflow_run' else (event['release']['tag_name'] if kind=='release' else os.environ['INPUT_TAG'])
          assert re.fullmatch(r'stable-[1-9][0-9]*',tag), 'Invalid stable tag'
          print(tag)
          PYCODE
          )
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          jq -e '.isDraft == false and .isPrerelease == false' "$RUNNER_TEMP/release.json"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  video-host:
    needs: resolve
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - name: Require the release commit to belong to main before executing build code
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --force
          git merge-base --is-ancestor HEAD origin/main
      - name: Compile the embedded Windows video host
        shell: pwsh
        run: ./tools/build-video-host.ps1
      # شعار VANTARA داخل exe لا يُكتب إلا على ويندوز؛ البناء على لينكس كان يفشل كل مرة
      # بـ «Missing --branded-exe» فلم تُنشر أي نسخة ويندوز منذ 0.3.18 (نفس خطوة نشر 0.3.18)
      - name: Embed original VANTARA artwork in pinned Electron executable
        shell: pwsh
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'electron.zip'
          Invoke-WebRequest 'https://github.com/electron/electron/releases/download/v44.7.2/electron-v44.7.2-win32-x64.zip' -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '10a89447ef64ac5cb9f782af48ffd83734a40ae91681259d1048ca3c9e6c5da4'){throw 'Electron checksum mismatch'}
          $electron=Join-Path $env:RUNNER_TEMP 'electron'
          Expand-Archive $zip $electron
          ./tools/brand-windows-executable.ps1 -InputExe (Join-Path $electron 'electron.exe') -OutputExe 'apps/desktop/native/VANTARA.exe'
          node tools/windows-icon-resources.mjs apps/desktop/native/VANTARA.exe apps/desktop/assets/vantara.ico
          if($LASTEXITCODE -ne 0){throw 'Executable artwork verification failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: stable-video-host
          path: |
            apps/desktop/native/vantara-video-host.exe
            apps/desktop/native/VANTARA.exe
          if-no-files-found: error
  build:
    needs: [resolve, video-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - name: Validate stable tag and fetch Android update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          git merge-base --is-ancestor HEAD origin/main
          mkdir -p "$RUNNER_TEMP/stable"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/stable" --pattern 'vantara-update.json' --pattern 'VANTARA-stable.apk' --pattern 'VANTARA-web.zip'
          node tools/release-manifest-validation.mjs "$RUNNER_TEMP/stable/vantara-update.json" "$RUNNER_TEMP/stable/VANTARA-stable.apk" "$RUNNER_TEMP/stable/VANTARA-web.zip"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'VANTARA-stable.apk'
          code="$(echo "$TAG" | sed 's/^stable-//')"
          test "$code" = "$(jq -r '.versionCode' "$RUNNER_TEMP/stable/vantara-update.json")"
          version="$(jq -r '.versionName' "$RUNNER_TEMP/stable/vantara-update.json")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          printf '%s\n' "$version" > "$RUNNER_TEMP/stable/VERSION.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Stamp the exact Android stable version into desktop
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,pathlib,re
          version=os.environ['VERSION']
          path=pathlib.Path('apps/desktop/package.json')
          data=json.loads(path.read_text())
          data['version']=version
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          path=pathlib.Path('apps/desktop/preload.cjs')
          path.write_text(re.sub(r"version: '[^']+'", "version: '"+version+"'", path.read_text(),count=1))
          path=pathlib.Path('apps/desktop/windows.nsi')
          text=path.read_text()
          text=re.sub(r'VIProductVersion "[^"]+"', 'VIProductVersion "'+version+'.0"', text, count=1)
          text=re.sub(r'(VIAddVersionKey "FileVersion" )"[^"]+"',r'\g<1>"'+version+'"',text,count=1)
          text=re.sub(r'("DisplayVersion" )"[^"]+"',r'\g<1>"'+version+'"',text,count=1)
          path.write_text(text)
          path=pathlib.Path('apps/web/lib/config.js')
          path.write_text(path.read_text().replace('__VANTARA_VERSION__',version))
          PY
      - name: Test desktop code and install packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y nsis 7zip
          node --test apps/desktop/security.test.cjs apps/desktop/first-party.test.cjs apps/desktop/profile.test.cjs apps/desktop/src/services.test.mjs apps/desktop/src/resource.test.mjs
          node --check apps/desktop/main.cjs
          node --check apps/web/desktop/update-check.js
          pnpm exec vitest run apps/web/desktop/update-check.test.js apps/web/lib/updater.test.js
      - uses: actions/download-artifact@v4
        with:
          name: stable-video-host
          path: ${{ runner.temp }}/video-host
      - name: Build release Windows binaries
        run: |
          node tools/build-windows.mjs --output="$RUNNER_TEMP/stable" --video-host="$RUNNER_TEMP/video-host/vantara-video-host.exe" --branded-exe="$RUNNER_TEMP/video-host/VANTARA.exe"
          test -s "$RUNNER_TEMP/stable/VANTARA-$VERSION-Windows-x64-Setup.exe"
          (cd "$RUNNER_TEMP/stable" && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: stable-windows-files
          path: |
            ${{ runner.temp }}/stable/*-Setup.exe
            ${{ runner.temp }}/stable/*-x64.zip
            ${{ runner.temp }}/stable/SHA256SUMS.txt
            ${{ runner.temp }}/stable/VERSION.txt
          compression-level: 0
          if-no-files-found: error

  verify:
    needs: [resolve, build]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: stable-windows-files
          path: ${{ runner.temp }}/stable
      - name: Install and exercise real Windows video engine
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:RUNNER_TEMP 'stable'
          $version=(Get-Content (Join-Path $folder 'VERSION.txt')).Trim()
          $installer=Join-Path $folder "VANTARA-$version-Windows-x64-Setup.exe"
          $installed=Join-Path $env:LOCALAPPDATA 'Programs\VANTARA-Release-Check'
          $process=Start-Process -FilePath $installer -ArgumentList "/S /D=$installed" -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Installer timed out' }
          if ($process.ExitCode -ne 0) { throw "Installer exit $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $installed 'VANTARA.exe'))) { throw 'VANTARA.exe missing' }
          node tools/windows-native-smoke.mjs (Join-Path $installed 'resources\app\native') (Join-Path $folder 'windows-native-report.json')
          if ($LASTEXITCODE -ne 0) { throw 'Windows player test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-stable-test-evidence
          path: ${{ runner.temp }}/stable/windows-native-report.json
          if-no-files-found: warn

  publish:
    needs: [resolve, build, verify]
    permissions:
      contents: write
    concurrency:
      group: windows-stable-publish-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: stable-windows-files
          path: ${{ runner.temp }}/stable
      - name: Upload binaries before advertising Windows update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/stable"
          version="$(cat "$dir/VERSION.txt")"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern 'vantara-update.json' --pattern 'VANTARA-stable.apk' --pattern 'VANTARA-web.zip'
          node tools/release-manifest-validation.mjs "$dir/vantara-update.json" "$dir/VANTARA-stable.apk" "$dir/VANTARA-web.zip"
          if jq -e '.desktop != null' "$dir/vantara-update.json" >/dev/null; then
            # Published Windows assets are immutable; reruns only verify them.
            mkdir -p "$dir/existing"
            name=$(basename "$(jq -r '.desktop.url' "$dir/vantara-update.json")")
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir/existing" --pattern "$name"
            node tools/release-manifest-validation.mjs "$dir/vantara-update.json" "$dir/VANTARA-stable.apk" "$dir/VANTARA-web.zip" "$dir/existing/$name"
            echo 'Windows update is already published and verified; preserving assets.'
            exit 0
          fi
          (cd "$dir" && sha256sum -c SHA256SUMS.txt)
          installer="$dir/VANTARA-$version-Windows-x64-Setup.exe"
          archive="$dir/VANTARA-$version-Windows-x64.zip"
          test -s "$installer" && test -s "$archive"
          node tools/unified-windows-manifest.mjs \
            --input "$dir/vantara-update.json" \
            --output "$dir/vantara-update.next.json" \
            --installer "$installer" --version "$version" \
            --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$installer" "$archive" "$dir/SHA256SUMS.txt" --clobber
          # Verify the uploaded files themselves before the manifest advertises them.
          mkdir -p "$dir/published"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir/published" --pattern "$(basename "$installer")" --pattern "$(basename "$archive")"
          cmp "$installer" "$dir/published/$(basename "$installer")"
          cmp "$archive" "$dir/published/$(basename "$archive")"
          cp "$dir/vantara-update.next.json" "$dir/vantara-update.json"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$dir/vantara-update.json" --clobber
