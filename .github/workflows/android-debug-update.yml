name: Android debug update channel

# قناة تحديث ذاتية مستقلة تمامًا عن stable.
# - تعمل فقط على debug/cinema-petrol-teal.
# - الحزمة com.vantara.app.debug، لذلك تعيش بجانب stable.
# - تستخدم مفتاح VANTARA الثابت حتى يستطيع Android تثبيت Debug فوق Debug.
# - تنشر Release تجريبي ثابت الاسم؛ stable /releases/latest لا يراه لأنه prerelease.
on:
  push:
    branches:
      - debug/cinema-petrol-teal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-update-channel
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify fixed signing key exists
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }

      - run: pnpm install --frozen-lockfile

      - name: Resolve debug channel version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # أكبر من أرقام android-debug القديمة (13xx) ويبقى أصغر كثيرًا من حد Android.
          code=$((1000000 + GITHUB_RUN_NUMBER))
          name="0.0.${code}-debug.${GITHUB_SHA:0:7}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Native fingerprint
        id: native
        run: |
          set -euo pipefail
          fp=$(node tools/native-fingerprint.mjs)
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      - name: Stamp debug web version
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          VERSION_NAME="$VERSION_NAME" python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('apps/web/lib/config.js')
          path.write_text(
              path.read_text(encoding='utf-8').replace('__VANTARA_VERSION__', os.environ['VERSION_NAME']),
              encoding='utf-8',
          )
          PY

      - name: Copy web assets into Android
        run: npx cap sync android

      - name: Stamp web bundle identity
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          NATIVE: ${{ steps.native.outputs.fingerprint }}
        run: |
          set -euo pipefail
          printf '{"version":"%s","native":"%s"}\n' "$VERSION_NAME" "$NATIVE" > android/app/src/main/assets/public/vantara-bundle.json

      - name: Decode fixed signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vantara.jks"
          test -s "$RUNNER_TEMP/vantara.jks"

      - name: Assemble update-capable debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/vantara.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: vantara
          VANTARA_VERSION_NAME: ${{ steps.version.outputs.name }}
          VANTARA_VERSION_CODE: ${{ steps.version.outputs.code }}
          VANTARA_NATIVE: ${{ steps.native.outputs.fingerprint }}
          VANTARA_UPDATE_CHANNEL: debug-cinema-petrol-teal
          VANTARA_DEBUG_SIGNED_UPDATES: 'true'
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Verify debug identity and signing
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$apk" || { echo 'No debug APK produced'; exit 1; }
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          pinned=$(grep -oE 'STABLE_CERT_SHA256 = "[0-9a-f]{64}"' android/app/src/main/kotlin/com/vantara/plugins/update/ApkCheck.kt | grep -oE '[0-9a-f]{64}')
          grep -q "certificate SHA-256 digest: $pinned" /tmp/apksigner.txt || {
            echo 'debug channel APK is not signed with the fixed VANTARA key'; exit 1;
          }
          "$tools/aapt2" dump badging "$apk" > /tmp/badging.txt
          grep -q "package: name='com.vantara.app.debug' versionCode='${VERSION_CODE}' " /tmp/badging.txt || {
            sed -n 1p /tmp/badging.txt
            echo 'unexpected debug package id or versionCode'; exit 1;
          }
          mkdir -p dist
          cp "$apk" dist/VANTARA-debug.apk

      - name: Package debug web bundle
        run: |
          set -euo pipefail
          (cd android/app/src/main/assets/public && zip -qr "$GITHUB_WORKSPACE/dist/VANTARA-debug-web.zip" .)

      - name: Build debug update manifest
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          NATIVE: ${{ steps.native.outputs.fingerprint }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/debug-cinema-petrol-teal"
          node tools/debug-update-manifest.mjs             --out dist/vantara-debug-update.json             --version "$VERSION_NAME"             --code "$VERSION_CODE"             --native "$NATIVE"             --base "$base"             --apk dist/VANTARA-debug.apk             --web dist/VANTARA-debug-web.zip

      - name: Publish isolated debug update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: debug-cinema-petrol-teal
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               dist/VANTARA-debug.apk               dist/VANTARA-debug-web.zip               dist/vantara-debug-update.json               --clobber
            gh release edit "$TAG"               --title "VANTARA Debug — $VERSION_NAME"               --notes "قناة Debug خاصة. لا تؤثر على Stable."               --prerelease
          else
            gh release create "$TAG"               dist/VANTARA-debug.apk               dist/VANTARA-debug-web.zip               dist/vantara-debug-update.json               --target "$GITHUB_SHA"               --title "VANTARA Debug — $VERSION_NAME"               --notes "قناة Debug خاصة. لا تؤثر على Stable."               --prerelease
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vantara-debug-update-apk
          path: dist/VANTARA-debug.apk
          if-no-files-found: error
          retention-days: 14
