name: VANTARA Runtime isolated Android execution (authored DEX)
on:
  push:
    branches: [feat/repository-compat-runtime-20261028]
    paths:
      - 'extensions/runtime-android/**'
      - '.github/workflows/runtime-android.yml'
      - 'tools/repository-compat/run_android_lab.sh'
  pull_request:
    paths:
      - 'extensions/runtime-android/**'
      - '.github/workflows/runtime-android.yml'
      - 'tools/repository-compat/run_android_lab.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-dex-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build external DEX fixture and isolated harness
        run: bash android/gradlew -p extensions/runtime-android :harness:assembleDebug :harness:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Execute actual DEX in isolated Android processes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/repository-compat/run_android_lab.sh
      - name: Capture lab logcat
        if: always()
        run: test -f runtime-lab-logcat.txt || timeout 5s adb logcat -d > runtime-lab-logcat.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-lab-api-${{ matrix.api }}-NOT-third-party-CS3
          path: |
            extensions/runtime-android/harness/build/outputs/androidTest-results/
            extensions/runtime-android/harness/build/reports/androidTests/
            runtime-lab-logcat.txt
          if-no-files-found: error
