name: VANTARA Runtime isolated Android execution (authored and pinned CS3 DEX)
on:
  push:
    branches: [feat/repository-compat-runtime-20261028]
    paths:
      - 'extensions/runtime-android/**'
      - '.github/workflows/runtime-android.yml'
      - 'tools/repository-compat/run_android_lab.sh'
      - 'tools/repository-compat/prepare_execution_fixtures.py'
  pull_request:
    paths:
      - 'extensions/runtime-android/**'
      - '.github/workflows/runtime-android.yml'
      - 'tools/repository-compat/run_android_lab.sh'
      - 'tools/repository-compat/prepare_execution_fixtures.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  http-and-profile-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Real TLS HTTP, disk session recovery and original CloudStream contract tests
        run: bash android/gradlew -p extensions/runtime-android :http:test :cloudstream:testDebugUnitTest :executor:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-and-cloudstream-contracts-NOT-live-source-success
          path: |
            extensions/runtime-android/http/build/test-results/
            extensions/runtime-android/cloudstream/build/test-results/
            extensions/runtime-android/executor/build/test-results/
          if-no-files-found: error
  actual-dex-and-process:
    name: ${{ matrix.profile }} (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 26, profile: unsupported-platform-guard}
          - {api: 28, profile: unsupported-platform-guard}
          - {api: 29, profile: full-execution}
          - {api: 35, profile: full-execution}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and extract pinned published CS3 for offline registration tests
        if: matrix.profile == 'full-execution'
        run: python3 tools/repository-compat/prepare_execution_fixtures.py --output extensions/runtime-android/harness/build/pinnedPackages
      - name: Build external DEX fixture and isolated harness
        run: |
          set -euo pipefail
          bash android/gradlew -p extensions/runtime-android :harness:assembleDebug :harness:assembleDebugAndroidTest :harness:lintDebug :executor:lintDebug --no-daemon --stacktrace 2>&1 | tee runtime-lab-build.log
          if rg -F 'Module was compiled with an incompatible version of Kotlin' runtime-lab-build.log; then
            exit 1
          fi
      - name: Execute selected acceptance profile (old-API guard is NOT provider execution)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RUNTIME_LAB_PROFILE: ${{ matrix.profile }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/repository-compat/run_android_lab.sh
      - name: Capture lab logcat
        if: always()
        run: test -f runtime-lab-logcat.txt || timeout 5s adb logcat -d VantaraRuntimeAbi:V AndroidRuntime:E ActivityManager:I TestRunner:I '*:S' > runtime-lab-logcat.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-lab-api-${{ matrix.api }}-${{ matrix.profile }}-NOT-live-source-health
          path: |
            extensions/runtime-android/harness/build/outputs/androidTest-results/
            extensions/runtime-android/harness/build/reports/androidTests/
            runtime-lab-logcat.txt
            runtime-lab-build.log
          if-no-files-found: error
