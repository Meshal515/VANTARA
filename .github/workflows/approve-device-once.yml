name: اعتماد جوال مؤقت - KXEC-GZ2N

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/approve-device-once.yml'

permissions:
  contents: read

concurrency:
  group: approve-device
  cancel-in-progress: false

env:
  D1_NAME: vantara
  WORKER_DIR: services/sync-worker

jobs:
  approve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify secrets exist
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VANTARA_DEVICE_PEPPER: \${{ secrets.VANTARA_DEVICE_PEPPER }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$VANTARA_DEVICE_PEPPER" || { echo 'Missing VANTARA_DEVICE_PEPPER'; exit 1; }

      - name: Resolve the D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$D1_NAME" \
                | jq -r --arg n "$D1_NAME" '.result[]? | select(.name == $n) | .uuid' | head -1)
          test -n "$id" && test "$id" != 'null' || { echo 'Could not resolve D1 id'; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Pin the database id into wrangler.toml
        working-directory: \${{ env.WORKER_DIR }}
        run: sed -i "s|__D1_DATABASE_ID__|\${{ steps.d1.outputs.id }}|" wrangler.toml

      - name: Approve the device
        working-directory: \${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VANTARA_DEVICE_PEPPER: \${{ secrets.VANTARA_DEVICE_PEPPER }}
          CODE: KXEC-GZ2N
        run: node tools/approve-device.mjs --code "$CODE"
