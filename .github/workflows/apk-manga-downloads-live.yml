name: APK manga downloads live sweep (real extensions, real pages)
# طلب المالك (15 نوفمبر): فحص جذري لتنزيل المانجا بإضافات حقيقية لا فصول وهمية. يبني Debug ويشغّله على محاكي،
# يثبّت إضافات Keiyoushi متنوعة، يقارن القراءة المباشرة بالمحمّل صفحةً صفحة (فك + SHA-256)، يقطع الشبكة وسط
# التنزيل ويعيدها، ويفتح الفصل المحمّل في القارئ الحقيقي بوضع الطيران. لا ينشر شيئًا ولا يلمس Stable.
on:
  push:
    branches: ['ccr-b856200a-l3de9l']
    paths:
      - '.github/workflows/apk-manga-downloads-live.yml'
      - 'tools/android-debug/manga-downloads-sweep.mjs'
      - 'apps/web/lib/downloads/**'
      - 'apps/web/lib/reader-engine.js'
      - 'apps/web/v35/reader*.js'
      - 'android/app/src/main/kotlin/com/vantara/plugins/ExtensionEnginePlugin.kt'
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated extension/source names (empty = default diverse set)
        required: false
        default: ''
      max:
        description: Maximum sources
        required: false
        default: '12'
permissions:
  contents: read
concurrency:
  group: apk-manga-downloads-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python3 -c "from pathlib import Path;p=Path('apps/web/lib/config.js');p.write_text(p.read_text().replace('__VANTARA_VERSION__','0.0.9102'))"
          npx cap sync android
          cd android && chmod +x gradlew
          VANTARA_VERSION_NAME=0.0.9102 VANTARA_VERSION_CODE=9102 ./gradlew --no-daemon -q :app:assembleDebug
          cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/candidate.apk"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Manga downloads sweep on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          MANGA_SOURCES: ${{ inputs.sources }}
          MANGA_MAX_SOURCES: ${{ inputs.max || '12' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p manga-evidence
            adb install candidate.apk
            adb logcat -c
            adb logcat -b all -v threadtime > manga-evidence/logcat.txt &
            adb shell am start -W -n com.vantara.app.debug/com.vantara.app.MainActivity
            sleep 8
            DEBUG_EVIDENCE=manga-evidence node tools/android-debug/manga-downloads-sweep.mjs || echo "sweep exit $?" > manga-evidence/exit.txt
            adb logcat -d -v threadtime -s ExtensionEngine:V CloudflareInterceptor:V > manga-evidence/engine.txt || true
            adb logcat -b crash -d -v threadtime > manga-evidence/logcat-crash.txt || true
      - name: Summarize
        if: always()
        run: |
          { echo '## تنزيل المانجا — مسح حي على محاكي'; cat manga-evidence/manga-sweep.md 2>/dev/null || echo 'لم يُنتج الجدول'; } | tee -a "$GITHUB_STEP_SUMMARY"
          test -f manga-evidence/exit.txt && cat manga-evidence/exit.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manga-downloads-live
          path: |
            manga-evidence/
            candidate.apk
