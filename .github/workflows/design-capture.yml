name: Design capture (manga work page, Stable vs Debug)
# لقطات مرجعية لصفحة عمل المانجا من APK حقيقي: Stable (main) كما هو، وأنماط Debug الحالية.
# للقراءة فقط: لا نشر ولا رفع لأي قناة ولا أسرار ولا دمج.
on:
  push:
    branches: [claude/modest-bardeen-a7nay1]
    paths:
      - docs/design/2026-11-12/capture/**
      - .github/workflows/design-capture.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: stable, ref: main }
          - { app: debug, ref: feat/addons-v7-native-manager-20261027 }
    steps:
      - uses: actions/checkout@v4
        with: { path: app, ref: '${{ matrix.ref }}' }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: app/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        working-directory: app
        run: |
          set -euo pipefail
          git log -1 --format='%H %s' | tee "$GITHUB_STEP_SUMMARY"
          pnpm install --frozen-lockfile
          V="0.0.9100" python3 -c "import os;from pathlib import Path;p=Path('apps/web/lib/config.js');p.write_text(p.read_text().replace('__VANTARA_VERSION__',os.environ['V']))"
          npx cap sync android
          cd android && chmod +x gradlew
          VANTARA_VERSION_NAME="0.0.9100" VANTARA_VERSION_CODE="9100" ./gradlew --no-daemon -q :app:assembleDebug
          cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/capture.apk"
      - uses: actions/upload-artifact@v4
        with: { name: 'apk-${{ matrix.app }}', path: capture.apk }

  capture:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: stable, styles: default }
          - { app: debug, styles: 'gallery,profile,resume' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: 'apk-${{ matrix.app }}', path: apks }
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture manga work page
        timeout-minutes: 35
        env:
          CAPTURE_STYLES: ${{ matrix.styles }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash docs/design/2026-11-12/capture/capture.sh apks/capture.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'capture-${{ matrix.app }}', path: capture-evidence/ }
