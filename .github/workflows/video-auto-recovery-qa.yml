name: VANTARA post-promotion silent rollback fault injection (Debug, no publish)

on:
  push:
    branches: [codex/vantara-video-repo-debug-20261101, codex/android-video-hardening-20261101]
    paths:
      - '.github/workflows/video-auto-recovery-qa.yml'
      - 'extensions/runtime-android/integration/src/androidTest/kotlin/com/vantara/runtime/RuntimePostPromotionRecoveryDeviceTest.kt'
      - 'extensions/runtime-android/integration/src/main/**'
      - 'extensions/runtime-android/executor/src/main/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vantara-post-upgrade-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-promotion-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ORG_GRADLE_PROJECT_vantaraRuntimeDebug: 'true'
      VANTARA_RUNTIME_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Prepare real pinned published CloudStream plugin bytes
        run: python3 tools/repository-compat/prepare_execution_fixtures.py --output extensions/runtime-android/harness/build/pinnedPackages
      - name: Build runtime-enabled APK and device test
        run: |
          set -euo pipefail
          npx cap sync android
          bash android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - run: sudo chmod 666 /dev/kvm
      - name: Verify durable rollback after three repeated failures and zero external data mutation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -camera-back none
          script: bash android/gradlew -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.vantara.runtime.RuntimePostPromotionRecoveryDeviceTest --no-daemon --stacktrace
      - name: Save all instrumentation evidence, including failed assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-promotion-rollback-real-dex-fault-injection
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
