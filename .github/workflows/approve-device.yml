name: اعتماد جوال

# جوالٌ جديد يعرض رمزًا من ثمانية أحرف على شاشة «من يتابع؟». المالك يشغّل
# هذا السير بالرمز (Actions ← اعتماد جوال ← Run workflow)، والتطبيق يدخل وحده.
#
# لا يطبع أي سر: الرمز مربوط بالجهاز الذي طلبه ويُستهلك مرة، فظهوره في سجل
# هذا المستودع العام لا يعطي أحدًا شيئًا. ويعمل من main وحده: نسخة فرعٍ معدّلة
# لا تُشغَّل بأسرار الإنتاج.

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'رمز الجوال كما يظهر على شاشته (مثل K7Q4-M2XD)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: approve-device
  cancel-in-progress: false

env:
  D1_NAME: vantara
  WORKER_DIR: services/sync-worker

jobs:
  approve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VANTARA_DEVICE_PEPPER: ${{ secrets.VANTARA_DEVICE_PEPPER }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$VANTARA_DEVICE_PEPPER" || { echo 'Missing VANTARA_DEVICE_PEPPER'; exit 1; }

      - name: Resolve the D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$D1_NAME" \
                | jq -r --arg n "$D1_NAME" '.result[]? | select(.name == $n) | .uuid' | head -1)
          test -n "$id" && test "$id" != 'null' || { echo 'Could not resolve D1 id'; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Pin the database id into wrangler.toml
        working-directory: ${{ env.WORKER_DIR }}
        run: sed -i "s|__D1_DATABASE_ID__|${{ steps.d1.outputs.id }}|" wrangler.toml

      - name: Approve the device
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VANTARA_DEVICE_PEPPER: ${{ secrets.VANTARA_DEVICE_PEPPER }}
          CODE: ${{ inputs.code }}
        run: node tools/approve-device.mjs --code "$CODE"
