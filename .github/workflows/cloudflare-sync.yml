name: Provision VANTARA Sync

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/sync-worker/**'
      - '.github/workflows/cloudflare-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  VANTARA_SESSION_SECRET: ${{ secrets.VANTARA_SESSION_SECRET }}

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$VANTARA_SESSION_SECRET" || { echo 'Missing VANTARA_SESSION_SECRET'; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail

          find_db() {
            wrangler d1 list --json \
              | jq -r '.[] | select(.name == "vantara-db") | (.uuid // .id // empty)' \
              | head -n 1
          }

          DB_ID="$(find_db)"
          if [ -z "$DB_ID" ]; then
            echo 'Creating D1 database: vantara-db'
            wrangler d1 create vantara-db
            DB_ID="$(find_db)"
          else
            echo 'D1 database already exists: vantara-db'
          fi

          test -n "$DB_ID" || { echo 'Unable to resolve D1 database ID'; exit 1; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "D1 ready: vantara-db"

      - name: Generate Wrangler configuration
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cat > cloudflare/sync-worker/wrangler.generated.json <<EOF
          {
            "name": "vantara-sync",
            "main": "src/index.js",
            "compatibility_date": "2026-09-17",
            "workers_dev": true,
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "vantara-db",
                "database_id": "$DB_ID"
              }
            ]
          }
          EOF

      - name: Apply D1 schema
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute vantara-db \
            --remote \
            --file=cloudflare/sync-worker/schema.sql \
            --config=cloudflare/sync-worker/wrangler.generated.json

      - name: Deploy sync Worker
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy --config=cloudflare/sync-worker/wrangler.generated.json

      - name: Install session signing secret in Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$VANTARA_SESSION_SECRET" \
            | wrangler secret put VANTARA_SESSION_SECRET \
                --config=cloudflare/sync-worker/wrangler.generated.json

      - name: Summary
        shell: bash
        run: |
          {
            echo '## VANTARA Cloudflare Sync'
            echo ''
            echo '- Worker: `vantara-sync`'
            echo '- D1: `vantara-db`'
            echo '- D1 binding: `DB`'
            echo '- Worker secret: `VANTARA_SESSION_SECRET`'
            echo '- Health endpoint: `/health`'
          } >> "$GITHUB_STEP_SUMMARY"
