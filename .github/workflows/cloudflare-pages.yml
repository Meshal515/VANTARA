name: Deploy web to Cloudflare Pages

on:
  push:
    branches:
      - '**'
    paths:
      - 'apps/web/**'
      - '.github/workflows/cloudflare-pages.yml'
  # إصدار جديد ⇒ version.json يُعاد نشره، وإلا لم يعرف أي تطبيق أن هناك أحدث
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_PAGES_PROJECT: vantara
  CF_PRODUCTION_BRANCH: claude/dreamy-faraday-w9rtsp

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare secrets exist
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Ensure Pages project exists and production branch is correct
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cf-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT")
          if [ "$code" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              --data "{\"name\":\"$CF_PAGES_PROJECT\",\"production_branch\":\"$CF_PRODUCTION_BRANCH\"}" \
              > /tmp/cf-create.json
            cat /tmp/cf-create.json
          elif [ "$code" = "200" ]; then
            curl -fsS -X PATCH \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT" \
              --data "{\"production_branch\":\"$CF_PRODUCTION_BRANCH\"}" \
              > /tmp/cf-update.json
            cat /tmp/cf-update.json
          else
            cat /tmp/cf-project.json
            exit 1
          fi

      # الواجهة في المتصفح تحتاج عنوان الـWorker أيضًا: بلا هذا تُظهر
      # «عنوان المزامنة غير مضبوط». يُستنتج من الحساب لا من سرّ إضافي.
      - name: Bake the sync endpoint into the web bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL_VAR: ${{ vars.VANTARA_API_URL }}
        run: |
          set -euo pipefail
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain // empty')
          sync=''
          if [ -n "$sub" ]; then sync="https://vantara-sync.$sub.workers.dev"; fi
          SYNC_URL="$sync" API_URL="${API_URL_VAR:-}" python3 - <<'PY'
          import os
          path = 'apps/web/lib/config.js'
          text = open(path, encoding='utf-8').read()
          text = text.replace('__VANTARA_SYNC_URL__', os.environ['SYNC_URL'])
          text = text.replace('__VANTARA_API_URL__', os.environ['API_URL'])
          open(path, 'w', encoding='utf-8').write(text)
          PY
          echo "sync=$sync"

      # نسخة التطبيق المنشورة، من آخر GitHub Release: مصدر واحد للحقيقة، ولا
      # ملف يُثبَّت في المستودع ثم ينسى أحد تحديثه.
      - name: Publish version.json for the in-app update check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo '')
          version="${tag#v}"
          if [ -z "$version" ]; then
            echo 'No release yet; publishing 0.0.0 so the check is a no-op.'
            version='0.0.0'
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/VANTARA-release.apk"
          cat > apps/web/version.json <<JSON
          { "version": "${version}", "url": "${url}", "notes": "" }
          JSON
          cat apps/web/version.json

      - name: Deploy static web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch="${GITHUB_REF_NAME}"
          if [ "$branch" != "$CF_PRODUCTION_BRANCH" ]; then
            echo "Preview deploy for $branch"
          else
            echo "Production deploy for $branch"
          fi
          npx --yes wrangler@4 pages deploy apps/web \
            --project-name="$CF_PAGES_PROJECT" \
            --branch="$branch"

      - name: Important deployment note
        run: |
          echo 'Frontend deployment completed.'
          echo 'The root pages.dev hostname is production only when the deploy branch matches CF_PRODUCTION_BRANCH.'
          echo 'VANTARA API endpoints (/v1/*) still require the backend origin.'
