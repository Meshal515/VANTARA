name: Deploy web to Cloudflare Pages

# الإنتاج لا ينشر مباشرة من push. نشر main يحدث فقط بعد نجاح VANTARA CI؛
# workflow_run يُقرأ من default branch ويملك الأسرار بعد أن ينتهي CI غير المميّز.
# حدث release مسموح لتحديث version.json، لكن tag وmain يجب أن يكونا من مسار مختبر.
on:
  workflow_run:
    workflows: ['VANTARA CI']
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  actions: read

env:
  CF_PAGES_PROJECT: vantara
  CF_PRODUCTION_BRANCH: main

jobs:
  deploy:
    # VANTARA تطبيق APK لا موقع: النشر على Pages مطفأ ما لم يُفعَّل صراحةً
    # بمتغيّر المستودع VANTARA_WEB_ENABLED=true. البوابات تحته كما هي.
    if: >-
      vars.VANTARA_WEB_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
       github.event_name == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # في مسار CI ننشر SHA الذي اختُبر بالضبط. في release نأخذ main الحالي؛
      # التحقق التالي يضمن أن release نفسه مبني على main وأن main الحالي اجتاز CI.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Verify release belongs to main
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --tags --force
          test -n "$RELEASE_TAG" || { echo 'Missing release tag'; exit 1; }
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main \
            || { echo "Release $RELEASE_TAG is not based on main"; exit 1; }

      - name: Verify main commit passed VANTARA CI
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse origin/main)
          passed=$(gh run list --workflow 'VANTARA CI' --commit "$MAIN_SHA" --status completed \
            --limit 20 --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length')
          test "$passed" -gt 0 \
            || { echo "main commit $MAIN_SHA has no successful VANTARA CI run"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare secrets exist
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Ensure Pages project exists and production branch is correct
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cf-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT")
          if [ "$code" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              --data "{\"name\":\"$CF_PAGES_PROJECT\",\"production_branch\":\"$CF_PRODUCTION_BRANCH\"}" \
              > /tmp/cf-create.json
            cat /tmp/cf-create.json
          elif [ "$code" = "200" ]; then
            curl -fsS -X PATCH \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT" \
              --data "{\"production_branch\":\"$CF_PRODUCTION_BRANCH\"}" \
              > /tmp/cf-update.json
            cat /tmp/cf-update.json
          else
            cat /tmp/cf-project.json
            exit 1
          fi

      # اسم المشروع «vantara» محجوز عالميًا لغيرنا، فعنوان Pages الفعلي فيه لاحقة
      # (vantara-bcf.pages.dev). الـWorkers لا تقبل إلا الأصل المكتوب في
      # ALLOWED_ORIGINS؛ فإن لم يطابق العنوانَ الفعلي يُنشر موقع لا يكلّم خادمه.
      - name: Verify the live Pages origin is allowed by the Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT" \
            | jq -r '.result.subdomain')
          origin="https://$sub"
          echo "Pages origin: $origin"
          for file in services/sync-worker/wrangler.toml services/web-fetcher/wrangler.toml; do
            grep -E '^ALLOWED_ORIGINS' "$file" | grep -qF "$origin" \
              || { echo "::error::$file ALLOWED_ORIGINS lacks $origin"; exit 1; }
          done

      # الواجهة في المتصفح تحتاج عنوان الـWorker أيضًا: بلا هذا تُظهر
      # «عنوان المزامنة غير مضبوط». يُستنتج من الحساب لا من سرّ إضافي.
      - name: Bake the sync endpoint into the web bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL_VAR: ${{ vars.VANTARA_API_URL }}
        run: |
          set -euo pipefail
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain // empty')
          sync=''
          if [ -n "$sub" ]; then sync="https://vantara-sync.$sub.workers.dev"; fi
          SYNC_URL="$sync" API_URL="${API_URL_VAR:-}" PWA_VERSION="pwa-$(git rev-parse --short=7 HEAD)" python3 - <<'PY'
          import hashlib, os, pathlib, re
          path = 'apps/web/lib/config.js'
          text = open(path, encoding='utf-8').read()
          text = text.replace('__VANTARA_SYNC_URL__', os.environ['SYNC_URL'])
          text = text.replace('__VANTARA_API_URL__', os.environ['API_URL'])
          text = text.replace('__VANTARA_VERSION__', os.environ['PWA_VERSION'])
          open(path, 'w', encoding='utf-8').write(text)
          worker = pathlib.Path('apps/web/sw.js')
          source = worker.read_text()
          digest = hashlib.sha256()
          for asset in re.findall(r"^\s*'(/[^']+)',$", source, re.M):
              digest.update(asset.encode())
              digest.update(pathlib.Path('apps/web', 'index.html' if asset == '/' else asset[1:]).read_bytes())
          source = re.sub(r"const SHELL_DIGEST = '[^']+';", f"const SHELL_DIGEST = '{digest.hexdigest()}';", source)
          worker.write_text(source)
          PY
          echo "sync=$sync"

      # نسخة التطبيق المنشورة، من آخر GitHub Release: مصدر واحد للحقيقة، ولا
      # ملف يُثبَّت في المستودع ثم ينسى أحد تحديثه.
      - name: Publish version.json for the in-app update check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo '')
          version="${tag#v}"
          if [ -z "$version" ]; then
            echo 'No release yet; publishing 0.0.0 so the check is a no-op.'
            version='0.0.0'
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/VANTARA-release.apk"
          cat > apps/web/version.json <<JSON
          { "version": "${version}", "url": "${url}", "notes": "" }
          JSON
          cat apps/web/version.json

      - name: Deploy production static web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Production deploy from $CF_PRODUCTION_BRANCH"
          npx --yes wrangler@4 pages deploy apps/web \
            --project-name="$CF_PAGES_PROJECT" \
            --branch="$CF_PRODUCTION_BRANCH"

      - name: Important deployment note
        run: |
          echo 'Frontend production deployment completed from a CI-approved main commit.'
          echo 'Feature branches are CI-only until an isolated preview project/token is introduced.'
          echo 'VANTARA API endpoints (/v1/*) still require the backend origin.'
