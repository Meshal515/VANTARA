name: Deploy web to Cloudflare Pages

on:
  push:
    branches:
      - '**'
    paths:
      - 'apps/web/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_PAGES_PROJECT: vantara
  CF_PRODUCTION_BRANCH: claude/dreamy-faraday-w9rtsp

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare secrets exist
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Ensure Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cf-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT")
          if [ "$code" = "200" ]; then
            echo "Pages project already exists"
            exit 0
          fi
          if [ "$code" != "404" ]; then
            cat /tmp/cf-project.json
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            --data "{\"name\":\"$CF_PAGES_PROJECT\",\"production_branch\":\"$CF_PRODUCTION_BRANCH\"}" \
            > /tmp/cf-create.json
          cat /tmp/cf-create.json

      - name: Deploy static web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy apps/web \
            --project-name="$CF_PAGES_PROJECT" \
            --branch="${GITHUB_REF_NAME}"

      - name: Important deployment note
        run: |
          echo 'Frontend deployment completed.'
          echo 'VANTARA API endpoints (/v1/*) still require the backend origin; Pages alone cannot run Uchiyomi/Suwayomi/Postgres.'
