<!--
  علامة VANTARA.

  حرف V هندسي عريض بشقّين في حرفه الداخلي، بنفسجي على أسود.

  ملاحظة صريحة: الشعار الكامل (V مع رأس الفرس) لم يصل كملف، فهذه العلامة
  تحمل جوهره — الحرف والشقّ واللون — بلا رأس الفرس. لاستبداله بالأصلي:
  ضع الشعار مكان هذا الملف ثم شغّل `node tools/build-icons.mjs`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000"/>

  <!-- الحرف: مضلّع واحد، ساقان تلتقيان في قمة حادة -->
  <path
    d="M88 118 L170 118 L256 330 L342 118 L424 118 L256 424 Z"
    fill="#8B3FEF"
  />

  <!-- الشقّان: يقتطعان الحرف الداخلي للساق اليسرى -->
  <path d="M208 205 L172 198 L196 236 Z" fill="#000000" />
  <path d="M238 279 L202 272 L226 310 Z" fill="#000000" />
</svg>
