<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>VANTARA</title>
    <meta name="description" content="مكتبة وقارئ خاص للمانجا والمانهوا والمانها" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS لا يقرأ الـmanifest: يحتاج وسومه الخاصة ليفتح بلا شريط متصفح -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VANTARA" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-512.png" sizes="512x512" />

    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/v35/core.css" />
    <link rel="stylesheet" href="/v35.css" />
    <link rel="stylesheet" href="/v35/reader.css" />
    <link rel="stylesheet" href="/v35/majlis.css" />
    <link rel="stylesheet" href="/v35/friends.css" />
    <link rel="stylesheet" href="/v35/profile.css" />
    <link rel="stylesheet" href="/v35/anime.css" />
    <link rel="stylesheet" href="/v35/rafiq.css" />
    <!--
      الخطوط محلية: طلب خارجي في أول رسم يؤخّر أول نص مقروء. وكلاهما متغيّر
      الوزن (400–800): الواجهة تطلب أوزانًا مثل 650 و760، وبلا خط متغيّر
      يقرّبها المتصفح إلى 400 أو 700 فيضيع التدرّج بين العنوان والنص.
      العربي Noto Sans (خط واجهة) لا Naskh (خط كتب)، واللاتيني Inter.
    -->
    <link rel="preload" href="/fonts/NotoSansArabic.var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-Latin.var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Vantara Sans';
        src: url('/fonts/Inter-Latin.var.woff2') format('woff2');
        font-weight: 400 800;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212;
      }
      @font-face {
        font-family: 'Vantara Sans';
        src: url('/fonts/NotoSansArabic.var.woff2') format('woff2');
        font-weight: 400 800;
        font-display: swap;
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+2010-2011, U+FB50-FDFF, U+FE70-FEFC;
      }
    </style>
  </head>
  <body>
    <!--
      الرسم الأول يطابق البوابة التي ستُبنى بعده: شعار واسم في المنتصف على
      أسود. أي شيء مختلف هنا يُنتج وميضًا بين الرسم الأول ورسم التطبيق.
    -->
    <div id="root">
      <main class="gate">
        <section class="gate__inner">
          <header class="gate__brand">
            <img class="gate__mark" src="/icons/icon-512.png" alt="" width="62" height="62" />
            <h1 class="gate__word">VANTARA</h1>
            <p class="gate__tag">عالم واحد .. لكل القصص</p>
          </header>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
